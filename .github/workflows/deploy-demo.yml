# Chỉ deploy bản demo (demo.tonghopposmegatech.io.vn), không đụng web thật (anh Vũ 08/10/2026: làm trên demo, test ok mới lên thật).
# Chạy khi đẩy code lên nhánh làm việc của Tổ web tổng, hoặc bấm Run workflow và chọn nhánh. Gộp vào main mới lên web thật (deploy.yml).
name: Deploy demo

on:
  push:
    branches: [claude/project-thread-3ujeoc]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/deploy-demo.mjs
      # Kiểm tra sau deploy: tài khoản demo đăng nhập được bằng mật khẩu ghi trên trang (chỉ in mã trạng thái và bước, không in phiên).
      - name: Thử đăng nhập demo
        run: |
          sleep 20
          for email in chu@demo.megatech.vn giamdoc@demo.megatech.vn; do
            code=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST https://demo.tonghopposmegatech.io.vn/api/auth/login \
              -H 'content-type: application/json' -d "{\"email\":\"$email\",\"password\":\"demo@2026\"}")
            step=$(node -e "try{const j=require('/tmp/login.json');console.log(j.step||j.error||'')}catch{console.log('')}")
            echo "$email -> HTTP $code $step"
            rm -f /tmp/login.json
            [ "$code" = "200" ] || exit 1
          done
