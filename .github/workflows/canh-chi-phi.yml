# Canh chi phí Cloudflare (anh Vũ 22/10/2026): mỗi giờ đọc mức dùng cả tài khoản, ghi app_settings cf_usage để canh gác nhắn Telegram
# khi dự tính gần chạm (70%) hoặc vượt phần gói, và để trang Cài đặt hiện mức dùng. Chỉ đọc số đo Cloudflare, ghi đúng một dòng; log không in số.
name: Canh chi phí Cloudflare

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: canh-chi-phi
  cancel-in-progress: true

jobs:
  canh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/cf-usage.mjs
