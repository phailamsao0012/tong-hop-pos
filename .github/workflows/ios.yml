# Build app iOS trên máy macOS của GitHub (không cần Mac): biên dịch bản Release chưa ký như ios/dong-goi-ipa.sh,
# đóng gói Megatech-unsigned.ipa (tải ở mục Artifacts của lần chạy). Code Swift lỗi biên dịch thì job báo đỏ và in lỗi.
# Đẩy vào main: tạo / cập nhật GitHub Release "ios-v<MARKETING_VERSION>-<CURRENT_PROJECT_VERSION>" kèm file IPA (tag luôn ở commit vừa build).
# Widget: job đỏ nếu app thiếu PlugIns/MegatechWidget.appex hoặc widget lệch bundle id / phiên bản với app. Megatech-unsigned.ipa bỏ widget
# (chưa duyệt); Megatech-widget-thu.ipa có widget, ký tạm (ad-hoc) kèm App Group. Chạy tay trên nhánh với probe_tag thì đăng pre-release bản thử.
name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      probe_tag:
        description: 'Tag pre-release bản thử widget (ví dụ ios-probe-widget-1). Chỉ dùng khi chạy trên nhánh khác main; để trống thì không đăng.'
        required: false
        default: ''
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUT_DIR: ${{ github.workspace }}/ipa
    steps:
      - uses: actions/checkout@v4

      # Mọi chỗ viết số, tiền, %, ngày giờ phải qua Format.swift (kế hoạch 1.1): ngoài Format.swift và FormatSelfTest.swift
      # không tạo formatter (…Formatter( , …Formatter.localizedString), không .formatted( / FormatStyle / format: .xxx /
      # Text(date, style: .time…), không nối tay " ₫" hay ") ₫", không String(format:) số lẻ hoặc chuỗi mẫu để trong biến.
      # Quét mọi file .swift dưới ios/, kể cả thư mục con (dự án dùng thư mục đồng bộ: file ở thư mục con cũng được biên dịch).
      # Mỗi mẫu một -e, không dùng \|, để chạy giống nhau trên grep của macOS (BSD) và GNU.
      - name: Chặn định dạng số và ngày ngoài Format.swift
        working-directory: ios
        run: |
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("${f#./}"); done < <(find . -name '*.swift' ! -name Format.swift ! -name FormatSelfTest.swift -print0)
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::Không thấy file .swift nào dưới ios/."; exit 1; }
          rc=0
          HITS="$(grep -nH -e 'Formatter(' -e 'Formatter\.localizedString' -e '\.formatted(' -e 'FormatStyle[(.]' -e 'format: *\.' \
            -e 'style: *\.time' -e 'style: *\.date' -e 'style: *\.relative' -e 'style: *\.offset' -e 'style: *\.timer' \
            -e '" ₫"' -e ') ₫' -e 'String(format: *"%[^"]*[fFeEgG]' -e 'String(format: *[^" ]' -- "${FILES[@]}")" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$HITS"
            while IFS= read -r line; do
              file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"
              echo "::error file=ios/$file,line=$ln::Định dạng số / ngày ngoài Format.swift: dùng hàm trong Fmt / VNDate."
            done <<<"$HITS"
            exit 1
          fi
          [ "$rc" -eq 1 ] || { echo "::error::grep lỗi (mã $rc)"; exit "$rc"; }
          echo "Không có chỗ định dạng số / ngày nào ngoài Format.swift (${#FILES[@]} file)."

      - name: Chọn Xcode mới nhất
        run: |
          # Bỏ bản beta nếu có bản chính thức; không có thì lấy bản mới nhất.
          XCODE="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1 || true)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Dùng $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDKS="$(xcodebuild -showsdks)"
          echo "$SDKS"
          # Xcode mới có thể chưa cài sẵn nền tảng iOS: tải về.
          if ! grep -q iphoneos <<<"$SDKS"; then xcodebuild -downloadPlatform iOS; fi

      - name: Build Release chưa ký
        working-directory: ios/Megatech
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          LIST="$(xcodebuild -list -project Megatech.xcodeproj || true)"
          echo "$LIST"
          # Dự án không lưu scheme dùng chung: xcodebuild tự tạo scheme Megatech; không có thì build theo target.
          SCHEMES="$(sed -n '/Schemes:/,$p' <<<"$LIST")"
          if grep -qE '^[[:space:]]+Megatech$' <<<"$SCHEMES"; then
            WHAT=(-scheme Megatech -destination 'generic/platform=iOS' -derivedDataPath "$BUILD_DIR")
          else
            WHAT=(-target Megatech -sdk iphoneos SYMROOT="$BUILD_DIR/Build/Products")
          fi
          # Chỉ in dòng lỗi / cảnh báo đáng chú ý cho gọn (log đầy đủ ở artifact xcodebuild-log);
          # mã thoát lấy của xcodebuild (PIPESTATUS) nên lỗi biên dịch vẫn làm job đỏ.
          set +e
          xcodebuild -project Megatech.xcodeproj "${WHAT[@]}" -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$LOG" | grep -E --line-buffered 'error:|warning: unre|BUILD|\*\* '
          STATUS=${PIPESTATUS[0]}
          set -e
          # Lỗi biên dịch hiện thành chú thích ngay trên file trong PR.
          grep -E '^/[^:]+:[0-9]+:[0-9]+: error: ' "$LOG" | sort -u | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; rest="${rest#*:}"; col="${rest%%:*}"; msg="${line#*: error: }"; msg="${msg//%/%25}"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$ln,col=$col::$msg"
          done || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild lỗi (mã $STATUS). 60 dòng cuối của log:"
            tail -60 "$LOG"
            exit "$STATUS"
          fi

      - name: Kiểm widget trong app
        run: |
          APP="$BUILD_DIR/Build/Products/Release-iphoneos/Megatech.app"
          EXT="$APP/PlugIns/MegatechWidget.appex"
          PB=/usr/libexec/PlistBuddy
          [ -d "$EXT" ] || { echo "::error::App thiếu PlugIns/MegatechWidget.appex"; ls -la "$APP" "$APP/PlugIns" 2>/dev/null || true; exit 1; }
          get() { "$PB" -c "Print :$1" "$2" 2>/dev/null || true; }
          POINT="$(get NSExtension:NSExtensionPointIdentifier "$EXT/Info.plist")"
          APP_ID="$(get CFBundleIdentifier "$APP/Info.plist")"; EXT_ID="$(get CFBundleIdentifier "$EXT/Info.plist")"
          APP_VER="$(get CFBundleShortVersionString "$APP/Info.plist")"; EXT_VER="$(get CFBundleShortVersionString "$EXT/Info.plist")"
          APP_BUILD="$(get CFBundleVersion "$APP/Info.plist")"; EXT_BUILD="$(get CFBundleVersion "$EXT/Info.plist")"
          echo "App $APP_ID $APP_VER ($APP_BUILD) · widget $EXT_ID $EXT_VER ($EXT_BUILD) · $POINT"
          FAIL=0
          [ "$POINT" = "com.apple.widgetkit-extension" ] || { echo "::error::NSExtensionPointIdentifier của widget là '$POINT', phải là com.apple.widgetkit-extension"; FAIL=1; }
          [ -n "$APP_ID" ] && [ "${EXT_ID#"$APP_ID".}" != "$EXT_ID" ] || { echo "::error::Bundle id widget '$EXT_ID' phải bắt đầu bằng '$APP_ID.'"; FAIL=1; }
          # Lệch phiên bản giữa widget và app thì iPhone từ chối cài.
          [ -n "$APP_VER" ] && [ "$EXT_VER" = "$APP_VER" ] || { echo "::error::Phiên bản widget '$EXT_VER' khác app '$APP_VER'"; FAIL=1; }
          [ -n "$APP_BUILD" ] && [ "$EXT_BUILD" = "$APP_BUILD" ] || { echo "::error::Số build widget '$EXT_BUILD' khác app '$APP_BUILD'"; FAIL=1; }
          exit "$FAIL"

      - name: Đóng gói IPA
        id: ipa
        run: |
          APP="$BUILD_DIR/Build/Products/Release-iphoneos/Megatech.app"
          [ -d "$APP" ] || { echo "::error::Không thấy $APP"; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          rm -rf "$OUT_DIR"; mkdir -p "$OUT_DIR/Payload"
          cp -R "$APP" "$OUT_DIR/Payload/"
          # Bản cho chủ giữ như cũ, chưa ký và không có widget: widget còn đang thử, ký bằng Apple ID miễn phí tốn thêm App ID cho mỗi extension.
          rm -rf "$OUT_DIR/Payload/Megatech.app/PlugIns"
          (cd "$OUT_DIR" && zip -qry Megatech-unsigned.ipa Payload && rm -rf Payload)
          # Chốt chặn (QA): bản thường không được có widget.
          LIST="$(unzip -l "$OUT_DIR/Megatech-unsigned.ipa")"
          if grep -q 'Megatech.app/PlugIns/' <<<"$LIST"; then echo "::error::Bản thường còn PlugIns"; exit 1; fi
          ls -l "$OUT_DIR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=ios-v$VERSION-$BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Megatech-unsigned-${{ steps.ipa.outputs.version }}-${{ steps.ipa.outputs.build }}
          path: ${{ env.OUT_DIR }}/Megatech-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ipa.outputs.tag }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
        run: |
          IPA="$OUT_DIR/Megatech-unsigned.ipa"
          NOTES="App iOS MEGATECH $VERSION (build $BUILD), bản chưa ký — ký bằng Sideloadly / AltStore / ESign rồi cài lên iPhone. Build từ commit $GITHUB_SHA."
          # Mỗi release ứng với đúng một commit: đẩy commit mới mà chưa tăng phiên bản / build thì xoá release và tag cũ
          # rồi tạo lại ở commit này, để tag, ghi chú và file IPA cùng một mã nguồn. Không dời tag bằng API vì GITHUB_TOKEN
          # có thể bị chặn khi giữa hai commit có đổi file workflow.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi
          # Tag còn sót (release đã xoá, hoặc lần trước xoá dở) cũng xoá, không thì release mới bám vào tag ở commit cũ.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          for i in 1 2 3; do
            gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "App iOS $VERSION ($BUILD)" --notes "$NOTES" && exit 0
            echo "Tạo release chưa được (lần $i), thử lại sau 5 giây…"; sleep 5
          done
          exit 1

      # Bản thử widget (plan 2.9): app có widget, ký tạm (ad-hoc) từ trong ra ngoài kèm entitlement App Group, để công cụ ký lại
      # (Sideloadly, ESign, Feather…) biết app cần App Group. Không có chứng chỉ hay khoá bí mật nào. Đặt sau bước GitHub Release
      # để bước này có lỗi cũng không chặn bản chính trên main.
      - name: Đóng gói bản thử widget (ký tạm)
        run: |
          APP_SRC="$BUILD_DIR/Build/Products/Release-iphoneos/Megatech.app"
          WORK="$RUNNER_TEMP/widget-thu"
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -R "$APP_SRC" "$WORK/Payload/"
          APP="$WORK/Payload/Megatech.app"
          EXT="$APP/PlugIns/MegatechWidget.appex"
          for f in app widget; do
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '<key>com.apple.security.application-groups</key><array><string>group.vn.megatech.tonghoppos</string></array>'
              echo '</dict></plist>'
            } > "$RUNNER_TEMP/$f.entitlements"
            plutil -lint "$RUNNER_TEMP/$f.entitlements"
          done
          # Thư viện nhúng (nếu có) ký trước, rồi tới widget, cuối cùng là app.
          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' \) -print | while IFS= read -r lib; do codesign -f -s - "$lib"; done
          codesign -f -s - --entitlements "$RUNNER_TEMP/widget.entitlements" "$EXT"
          codesign -f -s - --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          for b in "$EXT" "$APP"; do
            ENT="$(codesign -d --entitlements - "$b" 2>&1)"
            echo "$ENT"
            grep -q 'group.vn.megatech.tonghoppos' <<<"$ENT" || { echo "::error::$(basename "$b") thiếu entitlement App Group sau khi ký"; exit 1; }
          done
          codesign --verify --deep "$APP"
          (cd "$WORK" && zip -qry "$OUT_DIR/Megatech-widget-thu.ipa" Payload)
          rm -rf "$WORK"
          # Chốt chặn (QA): bản thử phải có widget.
          LIST="$(unzip -l "$OUT_DIR/Megatech-widget-thu.ipa")"
          grep -q 'Megatech.app/PlugIns/MegatechWidget.appex/' <<<"$LIST" || { echo "::error::Bản thử thiếu widget"; exit 1; }
          ls -l "$OUT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: Megatech-widget-thu-${{ steps.ipa.outputs.version }}-${{ steps.ipa.outputs.build }}
          path: ${{ env.OUT_DIR }}/Megatech-widget-thu.ipa
          if-no-files-found: error

      # Bản thử widget: chạy tay (workflow_dispatch) trên nhánh khác main với probe_tag, ví dụ ios-probe-widget-1.
      # Đăng pre-release, không đụng tới bản chính (tag ios-v… bị từ chối).
      - name: Pre-release bản thử widget
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.probe_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.probe_tag }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
        run: |
          LOWER="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in ios-v*) echo "::error::probe_tag không được bắt đầu bằng ios-v (dành cho bản chính)."; exit 1;; esac
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::probe_tag chỉ gồm chữ, số, dấu chấm, gạch ngang, gạch dưới."; exit 1; }
          NOTES="$RUNNER_TEMP/ghi-chu-ban-thu.md"
          {
            echo "Bản thử widget, không phải bản chính. App iOS $VERSION (build $BUILD), build từ commit $GITHUB_SHA."
            echo ""
            echo "- Megatech-widget-thu.ipa: app có widget. IPA đã ký tạm (ad-hoc), vẫn phải ký lại bằng công cụ đang dùng."
            echo "- Cài xong mở app một lần thì widget mới hiện trong thư viện widget."
            echo "- Sau khi cài: Thêm → Chẩn đoán widget → Sao chép kết quả, gửi lại cho tổ app."
            echo "- Bản thử build $BUILD; các bản sau phải có số build lớn hơn để cài đè."
            echo "- Muốn quay về bản thật (hoặc công cụ ký báo lỗi extension): cài lại Megatech-unsigned.ipa của Release mới nhất (https://github.com/$GITHUB_REPOSITORY/releases/latest) bằng cùng công cụ; công cụ không cho cài thì xóa app thử rồi cài lại."
            echo "- Đổi công cụ ký (ví dụ Sideloadly sang ESign) thì phải đăng nhập lại."
            echo "- Ký bằng Apple ID miễn phí: widget tốn thêm 1 App ID."
          } > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          for i in 1 2 3; do
            # Chỉ đăng file có widget: Megatech-unsigned.ipa của nhánh thử trùng tên bản thật nên không đăng ở đây.
            gh release create "$TAG" "$OUT_DIR/Megatech-widget-thu.ipa" --repo "$GITHUB_REPOSITORY" \
              --prerelease --target "$GITHUB_SHA" --title "Bản thử widget $VERSION ($BUILD)" --notes-file "$NOTES" && exit 0
            echo "Tạo pre-release chưa được (lần $i), thử lại sau 5 giây…"; sleep 5
          done
          exit 1
