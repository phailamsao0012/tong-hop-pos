name: Android preview
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-preview.yml']
  push:
    branches: [claude/app-android]
    paths: ['android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
env:
  BUILD_TOOLS_VERSION: '36.0.0'
defaults:
  run:
    shell: bash
jobs:
  quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: SDK, test và build debug
        run: |
          trap 'echo "::error::build: lệnh thất bại, mã=$?"; exit 1' ERR
          mkdir -p "$RUNNER_TEMP/video"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' "build-tools;$BUILD_TOOLS_VERSION" >"$RUNNER_TEMP/sdk.txt" 2>&1
          [[ -d "$ANDROID_HOME/platforms/android-37" ]] || ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          (cd android && bash gradlew :app:testDebugUnitTest :app:assembleDebug) >"$RUNNER_TEMP/build.txt" 2>&1
      - name: Chuẩn bị kịch bản máy ảo
        run: |
          trap 'echo "::error::chuan-bi: lệnh thất bại, mã=$?"; exit 1' ERR
          cat > "$RUNNER_TEMP/case.sh" <<'BASH'
          set -Eeuo pipefail
          part=$1
          trap 'echo "::error::$part: lệnh kiểm thất bại, mã=$?"; exit 1' ERR
          pkg=vn.megatech.tonghoppos.debug
          component=$pkg/vn.megatech.tonghoppos.MainActivity
          base=https://demo.tonghopposmegatech.io.vn
          out="$RUNNER_TEMP/video"
          fail() { echo "::error::$part: $1"; exit 1; }
          dump() {
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || fail 'không chụp được cây giao diện, số lần=1'
            adb exec-out cat /sdcard/window.xml > "$RUNNER_TEMP/ui.xml" 2>/dev/null || fail 'không đọc được cây giao diện, số lần=1'
          }
          has() { dump; grep -Fq "$1" "$RUNNER_TEMP/ui.xml"; }
          wait_text() {
            for n in $(seq 1 30); do if has "$1"; then return; fi; sleep 1; done
            fail "thiếu mốc giao diện, số lượt=30"
          }
          start() { adb shell am start -f 0x20000000 -n "$component" -e base "$base" -e secure "$1" -e tour "$2" > /dev/null 2>&1; }
          unlock() {
            for n in $(seq 1 30); do
              if adb logcat -d -s MEGATECH:D '*:S' | grep -q 'hoi-xac-thuc'; then
                adb shell input text 2468 >/dev/null 2>&1
                adb shell input keyevent 66 >/dev/null 2>&1
                return
              fi
              sleep 1
            done
            fail 'thiếu hoi-xac-thuc, số lượt=30'
          }
          keyguard_showing() {
            adb shell dumpsys window > "$RUNNER_TEMP/keyguard.txt" 2>/dev/null || fail 'không đọc được trạng thái keyguard, số lần=1'
            grep -Eq '(mDreamingLockscreen|isKeyguardShowing|mShowingLockscreen)=true' "$RUNNER_TEMP/keyguard.txt"
          }
          dismiss_keyguard() {
            adb shell input keyevent 224 >/dev/null 2>&1 || fail 'không đánh thức được máy ảo, số lần=1'
            adb shell wm dismiss-keyguard >/dev/null 2>&1 || fail 'không yêu cầu bỏ keyguard được, số lần=1'
            for attempt in $(seq 1 10); do
              if ! keyguard_showing; then return; fi
              # dismiss-keyguard có thể chỉ đánh thức màn khóa, ô PIN chưa nhận nhập.
              # Mở màn nhập PIN và chờ ổn định trước khi gửi, tối đa ba lần.
              if [[ "$attempt" == 1 || "$attempt" == 4 || "$attempt" == 7 ]]; then
                adb shell input keyevent 82 >/dev/null 2>&1 || fail 'không mở được màn PIN keyguard, số lần=1'
                sleep 1
                adb shell input text 2468 >/dev/null 2>&1 || fail 'không mở được keyguard, số lần=1'
                adb shell input keyevent 66 >/dev/null 2>&1 || fail 'không xác nhận keyguard được, số lần=1'
              fi
              sleep 1
            done
            if keyguard_showing; then fail 'keyguard còn hiện, số lượt=10'; fi
          }
          case "$part" in
            6.4.5)
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1
              # Không đặt PIN cho ca này. Phiên demo chỉ truyền qua file tạm riêng.
              # Lấy tài khoản demo công khai từ mã seed, không ghi thông tin đăng nhập vào log.
              if ! python3 - <<'PY'
          import json, os, pathlib, re
          source = pathlib.Path('lib/demo/mode.ts').read_text(encoding='utf-8')
          password = re.search(r"export const DEMO_PASSWORD = '([^']+)'", source)
          account = re.search(r"export const DEMO_ACCOUNTS = \[\s*\{ email: '([^']+)'", source)
          if not password or not account:
              raise SystemExit(1)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'demo-login.json'
          path.write_text(json.dumps(dict(email=account[1], password=password[1], remember=True)), encoding='utf-8')
          PY
              then
                echo '::error::demo: không đọc được tài khoản demo công khai'; fail 'không đọc được tài khoản demo công khai, số tài khoản=0'
              fi
              if ! curl -fsS -o /dev/null "$base/login" 2>/dev/null || ! curl -fsS -c "$RUNNER_TEMP/cookies" -o /dev/null -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/demo-login.json" "$base/api/auth/login" 2>/dev/null; then
                rm -f "$RUNNER_TEMP/demo-login.json"
                echo '::error::demo: đăng nhập demo hỏng'; fail 'đăng nhập demo hỏng, số phiên hợp lệ=0'
              fi
              rm -f "$RUNNER_TEMP/demo-login.json"
              session=$(awk '$6=="thp_session" {print $7}' "$RUNNER_TEMP/cookies")
              [[ -n "$session" ]] || { echo '::error::demo: đăng nhập demo hỏng'; fail 'đăng nhập demo hỏng, số phiên hợp lệ=0'; }
              echo "::add-mask::$session"
              [[ "$session" =~ ^[A-Za-z0-9._~-]+$ ]] || { echo '::error::demo: phiên demo có dạng không hỗ trợ'; fail 'phiên demo có dạng không hỗ trợ, số phiên hợp lệ=0'; }
              adb shell am start -n "$component" -e base "$base" -e session "$session" -e secure 0 >/dev/null 2>&1
              wait_text 'Nhập mật khẩu MEGATECH để xác thực.'
              adb shell am force-stop "$pkg" >/dev/null 2>&1
              start 0 khoa
              wait_text 'Nhập mật khẩu MEGATECH để xác thực.'
              adb shell input keyevent 3 >/dev/null 2>&1
              ;;
            6.4.7)
              # Mỗi action bật lại máy ảo; không giả định APK và phiên còn từ ca trước.
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1 || fail 'không cài được app cho ca này, số APK=1'
              adb shell am force-stop "$pkg" >/dev/null 2>&1 || fail 'không dừng được app trước khi ghi khóa cũ, số lần=1'
              if ! adb shell run-as "$pkg" ls shared_prefs/megatech.xml >/dev/null 2>&1 ||
                 ! adb exec-out run-as "$pkg" cat shared_prefs/megatech.xml > "$RUNNER_TEMP/legacy.xml" 2>/dev/null ||
                 [[ ! -s "$RUNNER_TEMP/legacy.xml" ]] ||
                 ! head -n 1 "$RUNNER_TEMP/legacy.xml" | grep -aqE '^(<\?xml|<map|ABX)'; then
                printf "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n<map />\n" > "$RUNNER_TEMP/legacy.xml" || fail 'không tạo được map rỗng, số file=1'
                echo '::notice::6.4.7: megatech.xml chưa có hoặc không đọc được, dùng map rỗng'
              fi
              # Android mới có thể lưu SharedPreferences ở dạng ABX, ElementTree chỉ đọc XML văn bản.
              if [[ "$(head -c 3 "$RUNNER_TEMP/legacy.xml")" == ABX ]]; then
                adb shell run-as "$pkg" abx2xml shared_prefs/megatech.xml cache/legacy.xml >/dev/null 2>&1 || fail 'không đổi được ABX sang XML văn bản, số file=1'
                adb exec-out run-as "$pkg" cat cache/legacy.xml > "$RUNNER_TEMP/legacy.xml" 2>/dev/null || fail 'không đọc được XML đã chuyển đổi, số file=1'
                adb shell run-as "$pkg" rm cache/legacy.xml >/dev/null 2>&1 || fail 'không xóa được XML tạm, số file=1'
              fi
              python3 - <<'PY' || fail 'không tạo được XML khóa cũ, số file=1'
          import os, xml.etree.ElementTree as ET
          path = os.environ['RUNNER_TEMP'] + '/legacy.xml'
          try:
              tree = ET.parse(path)
          except Exception as error:
              print('::error::6.4.7: XML khóa cũ hỏng: ' + type(error).__name__)
              raise SystemExit(1)
          root = tree.getroot()
          for child in list(root):
              if child.get('name') in ('lock', 'lock_grace', 'secure'): root.remove(child)
          for kind, name, value in [('boolean', 'lock', 'false'), ('int', 'lock_grace', '1'), ('boolean', 'secure', 'false')]:
              ET.SubElement(root, kind, name=name, value=value)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
              # exec-in truyền XML qua stdin trực tiếp, không qua shell tương tác của adb.
              adb shell run-as "$pkg" mkdir -p shared_prefs >/dev/null 2>&1 || fail 'không tạo được thư mục cài đặt, số thư mục=1'
              adb exec-in run-as "$pkg" tee shared_prefs/megatech.xml < "$RUNNER_TEMP/legacy.xml" >/dev/null 2>&1 || fail 'không ghi được khóa cũ, số file=1'
              session=$(awk '$6=="thp_session" {print $7}' "$RUNNER_TEMP/cookies")
              [[ -n "$session" && "$session" =~ ^[A-Za-z0-9._~-]+$ ]] || { echo '::error::demo: đăng nhập demo hỏng'; fail 'không có phiên demo hợp lệ, số phiên=0'; }
              echo "::add-mask::$session"
              adb shell am start -n "$component" -e base "$base" -e session "$session" -e secure 1 -e tour khoa >/dev/null 2>&1 || fail 'không mở lại được app, số lần=1'
              wait_text 'Nhập mật khẩu MEGATECH để xác thực.'
              for attempt in $(seq 1 10); do
                adb exec-out run-as "$pkg" cat shared_prefs/megatech.xml > "$RUNNER_TEMP/legacy.xml" 2>/dev/null || fail 'không đọc được cài đặt app, số file=1'
                if ! grep -Eq 'name="(lock|lock_grace|secure)"' "$RUNNER_TEMP/legacy.xml"; then break; fi
                if [[ "$attempt" == 10 ]]; then fail 'còn khóa cũ, số kỳ vọng=0'; fi
                sleep 1
              done
              adb shell locksettings set-pin 2468 >/dev/null 2>&1 || fail 'không đặt được PIN cho ca tiếp theo, số lần=1'
              ;;
            1-khoa|2-che|6.4.12|3-xn-kho|5-team|5-team-cau|4-so-cung-ky|4-so-cung-ky-rieng|6.2.6|6.2.7|6.2.8)
              # Hai ca dùng cùng bộ mở khóa đã qua CI ở 1-khoa.
              # Cửa sổ xác thực bảo mật có thể không xuất ô PIN trong XML.
                unlock() {
                  local pin_attempts=0 retry_attempts=0
                  for n in $(seq 1 30); do
                    dump
                    if grep -Fq 'Bảng thử bản debug' "$RUNNER_TEMP/ui.xml"; then
                      if [[ "$part" == 1-khoa || "$part" == 2-che || "$part" == 6.4.12 ]]; then
                        adb logcat -d -s MEGATECH:D '*:S' > "$RUNNER_TEMP/pin-log.txt" 2>/dev/null || fail 'không đọc được mốc, số lần=1'
                        grep -q 'hoi-xac-thuc' "$RUNNER_TEMP/pin-log.txt" || fail 'thiếu hoi-xac-thuc, số dòng=0'
                        grep -q 'xac-thuc-dung' "$RUNNER_TEMP/pin-log.txt" || fail 'mở bằng PIN không xong, số lần=0'
                      fi
                      return
                    fi
                    adb logcat -d -s MEGATECH:D '*:S' > "$RUNNER_TEMP/pin-log.txt" 2>/dev/null || fail 'không đọc được mốc xác thực, số lần=1'
                    if [[ "$part" == 1-khoa || "$part" == 6.4.12 || "$part" == 3-xn-kho || "$part" == 5-team* || "$part" == 4-so-cung-ky* || "$part" == 6.2.* ]] && grep -Fq 'xac-thuc-dung' "$RUNNER_TEMP/pin-log.txt"; then
                      if [[ "$part" == 1-khoa || "$part" == 6.4.12 ]]; then grep -q 'hoi-xac-thuc' "$RUNNER_TEMP/pin-log.txt" || fail 'thiếu hoi-xac-thuc, số dòng=0'; fi
                      return
                    fi
                    adb shell dumpsys window > "$RUNNER_TEMP/pin-window-all.txt" 2>/dev/null || fail 'không đọc được cửa sổ PIN, số lần=1'
                    grep -E 'mCurrentFocus|mFocusedApp' "$RUNNER_TEMP/pin-window-all.txt" > "$RUNNER_TEMP/pin-window.txt" || [[ "$?" == 1 ]] || fail 'không lọc được focus cửa sổ PIN, số file=1'
                    python3 - "$part" <<'PY' > "$RUNNER_TEMP/pin-node.txt" || fail 'không dò được node PIN, số file=1'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          try:
              nodes = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'ui.xml').getroot().iter('node')
              for node in nodes:
                  if node.get('package') not in ('com.android.systemui', 'com.android.settings') or node.get('password') != 'true':
                      continue
                  bounds = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
                  if bounds:
                      left, top, right, bottom = map(int, bounds.groups())
                      if right > left and bottom > top:
                          print((left + right) // 2, (top + bottom) // 2)
                          break
          except Exception as error:
              print('::error::' + __import__('sys').argv[1] + ': XML dò PIN hỏng: ' + type(error).__name__ + ', số file=1', file=__import__('sys').stderr)
              raise SystemExit(1)
          PY
                    if [[ "$pin_attempts" -lt 3 ]] &&
                       grep -q 'hoi-xac-thuc' "$RUNNER_TEMP/pin-log.txt" &&
                       [[ -s "$RUNNER_TEMP/pin-node.txt" ]]; then
                      local pin_x pin_y
                      read -r pin_x pin_y < "$RUNNER_TEMP/pin-node.txt" || fail 'không đọc được tâm node PIN, số node=1'
                      adb shell input tap "$pin_x" "$pin_y" >/dev/null 2>&1 || fail 'không bấm được node PIN, số node=1'
                      adb shell input text 2468 >/dev/null 2>&1 || fail 'không nhập được PIN hệ thống, số lần=1'
                      adb shell input keyevent 66 >/dev/null 2>&1 || fail 'không xác nhận được PIN hệ thống, số lần=1'
                      pin_attempts=$((pin_attempts + 1))
                    elif [[ "$pin_attempts" -lt 3 ]] &&
                       grep -q 'hoi-xac-thuc' "$RUNNER_TEMP/pin-log.txt" &&
                       grep 'mCurrentFocus=' "$RUNNER_TEMP/pin-window.txt" | grep -vF 'vn.megatech.tonghoppos' | grep -Eq 'mCurrentFocus=Window\{'; then
                      sleep 2
                      if [[ "$part" == 6.4.12 ]]; then
                        adb shell input text 2468 >/dev/null 2>&1 || fail 'mở bằng PIN không xong, số lần=1'
                        adb shell input keyevent 66 >/dev/null 2>&1 || fail 'mở bằng PIN không xong, số lần=1'
                      else
                        adb shell input keyevent 9 11 13 15 66 >/dev/null 2>&1 || fail 'không gửi được phím PIN hệ thống, số lần=1'
                      fi
                      pin_attempts=$((pin_attempts + 1))
                    elif [[ "$retry_attempts" -lt 3 && "$n" -ge 3 && $((n % 5)) == 3 ]] &&
                       grep -q 'hoi-xac-thuc' "$RUNNER_TEMP/pin-log.txt" &&
                       grep 'mCurrentFocus=' "$RUNNER_TEMP/pin-window.txt" | grep -Fq "$pkg/" &&
                       [[ ! -s "$RUNNER_TEMP/pin-node.txt" ]]; then
                      # Prompt có thể đã đóng: chỉ bấm nút xác thực thật, không gửi PIN vào app.
                      python3 - "$part" <<'PY' > "$RUNNER_TEMP/retry-node.txt" || fail 'không dò được nút thử lại xác thực, số file=1'
          import os, re, unicodedata, xml.etree.ElementTree as ET
          from pathlib import Path
          try:
              root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'ui.xml').getroot()
              parents = {child: parent for parent in root.iter() for child in parent}
              # Chỉ tìm hành động xác thực đã biết; không nhập PIN vào cửa sổ app.
              labels = ('Đăng nhập bằng vân tay / khuôn mặt', 'Mở bằng vân tay / khuôn mặt',
                        'Use PIN', 'Use pin', 'Dùng mã PIN', 'Sử dụng mã PIN')
              def normalized(value):
                  return ' '.join(unicodedata.normalize('NFC', value).split()).casefold()
              for node in root.iter('node'):
                  # Compose có thể gộp nhãn nút với chữ khác hoặc xuống dòng trong cùng node.
                  # Nút chuyển sang PIN của prompt có thể thuộc gói hệ thống dù focus vẫn ở app.
                  if node.get('package') not in ('vn.megatech.tonghoppos.debug', 'com.android.systemui', 'com.android.settings') or not any(
                      normalized(label) == normalized(node.get(field, '')) or (
                          node.get('clickable') == 'true' and normalized(label) in normalized(node.get(field, '')))
                      for field in ('text', 'content-desc') for label in labels):
                      continue
                  target = node
                  while target is not None:
                      # Node nhãn Compose có thể không xuất clickable; chạm nhãn vẫn tới nút cha.
                      if target.get('enabled') == 'true' and (target is node or target.get('clickable') == 'true'):
                          bounds = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', target.get('bounds', ''))
                          if bounds:
                              left, top, right, bottom = map(int, bounds.groups())
                              if right > left and bottom > top:
                                  print((left + right) // 2, (top + bottom) // 2)
                                  raise SystemExit(0)
                      target = parents.get(target)
          except Exception as error:
              print('::error::' + __import__('sys').argv[1] + ': XML nút thử lại hỏng: ' + type(error).__name__ + ', số file=1', file=__import__('sys').stderr)
              raise SystemExit(1)
          PY
                      if [[ -s "$RUNNER_TEMP/retry-node.txt" ]]; then
                        local retry_x retry_y
                        read -r retry_x retry_y < "$RUNNER_TEMP/retry-node.txt" || fail 'không đọc được tâm nút thử lại, số node=1'
                        adb shell input tap "$retry_x" "$retry_y" >/dev/null 2>&1 || fail 'không bấm được nút thử lại xác thực, số node=1'
                        retry_attempts=$((retry_attempts + 1))
                      fi
                    fi
                    sleep 1
                  done
                  adb logcat -d > "$RUNNER_TEMP/auth-diagnostic.txt" 2>/dev/null || fail 'không đọc được số đếm xác thực, số lần=1'
                  for marker in xac-thuc-cho xac-thuc-mo xac-thuc-loi xac-thuc-dung 'Unable to start authentication'; do
                    count=$(grep -Fc "$marker" "$RUNNER_TEMP/auth-diagnostic.txt" || [[ "$?" == 1 ]]) || fail 'không đếm được mốc xác thực, số file=1'
                    echo "::error::$part: $marker, số dòng=$count"
                  done
                  if keyguard_showing; then
                    echo "::error::$part: keyguard đang hiện=1"
                  else
                    echo "::error::$part: keyguard đang hiện=0"
                  fi
                  adb exec-out screencap -p > "$out/$part-pin-$authentication_round.png" 2>/dev/null || fail 'không chụp được cửa sổ PIN, số ảnh=1'
                  [[ -s "$out/$part-pin-$authentication_round.png" ]] || fail 'ảnh cửa sổ PIN rỗng, số byte=0'
                  if [[ "$part" == 6.4.12 ]]; then fail 'mở bằng PIN không xong, số lần=30'; fi
                  fail 'ô PIN hệ thống chưa sẵn sàng, số lượt=30'
                }
              if [[ "$part" == 1-khoa ]]; then
                wait_text() {
                  for n in $(seq 1 30); do if has "$1"; then return; fi; sleep 1; done
                  fail "thiếu mốc hộp thử sau xác thực lần=$authentication_round, số lượt=30"
                }
                authentication_round=1
                # Mỗi action có thể khởi động máy ảo mới: tự chuẩn bị ca quay này.
                trap 'echo "::error::1-khoa: lệnh kiểm thất bại, dòng=$LINENO, mã=$?"; exit 1' ERR
                adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1 || fail 'không cài được app cho ca này, số APK=1'
                if ! adb shell locksettings verify --old 2468 >/dev/null 2>&1; then
                  adb shell locksettings set-pin 2468 >/dev/null 2>&1 || fail 'không đặt được PIN cho ca này, số lần=1'
                fi
                session=$(awk '$6=="thp_session" {print $7}' "$RUNNER_TEMP/cookies")
