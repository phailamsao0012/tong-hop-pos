# Xem trước app Android 1.0 trên máy ảo, chỉ với web ảo chạy ngay trên máy GitHub (127.0.0.1, số ảo).
# Không gọi demo hay web thật trên Cloudflare (anh Vũ 12/11: hạn mức đọc D1 dùng chung với web nhân sự).
# Thay lượt quay 0.4 (gọi demo.tonghopposmegatech.io.vn) bằng lượt chụp giao diện sáng/tối (plan Android 1.0, bước A0, 18/11).
# Ảnh ở mục Artifacts ("android-preview", giữ 7 ngày) và ở nhánh android-preview (ghi đè mỗi lần chạy).
name: Android preview
on:
  push:
    branches: [claude/app-android-1.0]
    paths: ['android/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  BUILD_TOOLS_VERSION: '36.0.0'
defaults:
  run:
    shell: bash
jobs:
  chup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      OUT: ${{ github.workspace }}/preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: SDK, test và build debug
        run: |
          trap 'echo "::error::build: lệnh thất bại, mã=$?"; grep -E "^e: |FAILED|What went wrong" "$RUNNER_TEMP/build.txt" | sed "s#$GITHUB_WORKSPACE/##g" | head -40; exit 1' ERR
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' "build-tools;$BUILD_TOOLS_VERSION" >"$RUNNER_TEMP/sdk.txt" 2>&1
          [[ -d "$ANDROID_HOME/platforms/android-37" ]] || ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          (cd android && bash gradlew :app:testDebugUnitTest :app:assembleDebug) >"$RUNNER_TEMP/build.txt" 2>&1

      - name: Cài pnpm cho web ảo
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: '10'
      - name: Cài Node cho web ảo
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Web ảo
        timeout-minutes: 18
        run: bash scripts/ci/web-ao.sh
      - name: Chặn gọi demo
        run: |
          case "$BASE" in http://127.0.0.1:*) echo "web-ao: chỉ dùng $BASE";; *) echo "::error::BASE không phải web ảo: không được gọi demo hay web thật"; exit 1;; esac
      - name: Phiên đăng nhập bản demo
        run: |
          # Tài khoản demo công khai của web ảo (mật khẩu in sẵn trên trang đăng nhập demo). Không in token ra log.
          TOKEN="$(curl -sS -c - -o /dev/null -H 'content-type: application/json' \
            -d '{"email":"chu@demo.megatech.vn","password":"demo@2026","remember":true}' "$BASE/api/auth/login" | awk '$6=="thp_session"{print $7}')"
          [ -n "$TOKEN" ] || { echo "::error::Không lấy được phiên web ảo"; exit 1; }
          [[ "$TOKEN" =~ ^[A-Za-z0-9._~-]+$ ]] || { echo "::error::Phiên web ảo có dạng lạ"; exit 1; }
          echo "::add-mask::$TOKEN"; echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Kịch bản chụp
        run: |
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/chup.sh" <<'BASH'
          set -Eeuo pipefail
          trap 'echo "::error::chup: lệnh thất bại, dòng=$LINENO, mã=$?"; exit 1' ERR
          pkg=vn.megatech.tonghoppos.debug
          component=$pkg/vn.megatech.tonghoppos.MainActivity
          # Máy ảo thấy 127.0.0.1 của máy GitHub qua 10.0.2.2: vẫn là web ảo, không ra mạng ngoài.
          base="http://10.0.2.2:${BASE##*:}"
          case "$BASE" in http://127.0.0.1:*) ;; *) echo "::error::chup: BASE không phải web ảo"; exit 1;; esac
          ui_stages=(tab-0 tab-1 tab-2 tab-3 tab-4)
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          # App khoá bằng khoá máy: đặt PIN cho máy ảo, app hỏi thì nhập PIN.
          adb shell locksettings verify --old 2468 >/dev/null 2>&1 || adb shell locksettings set-pin 2468 >/dev/null
          keyguard_showing() { adb shell dumpsys window | grep -Eq '(mDreamingLockscreen|isKeyguardShowing|mShowingLockscreen)=true'; }
          dismiss_keyguard() {
            adb shell input keyevent 224 >/dev/null 2>&1 || true
            adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
            for attempt in $(seq 1 10); do
              keyguard_showing || return 0
              if [[ "$attempt" == 1 || "$attempt" == 4 || "$attempt" == 7 ]]; then
                adb shell input keyevent 82; sleep 1; adb shell input text 2468; adb shell input keyevent 66
              fi
              sleep 1
            done
            echo "::error::chup: màn khoá máy ảo còn hiện"; exit 1
          }
          unlock_app() {
            for n in $(seq 1 60); do
              if adb logcat -d -s MEGATECH:D '*:S' | grep -q 'hoi-xac-thuc'; then
                adb shell input text 2468; adb shell input keyevent 66; return 0
              fi
              if adb logcat -d -s MEGATECH:D '*:S' | grep -q '\[UI\] moc='; then return 0; fi
              sleep 1
            done
            echo "::warning::chup: app không hỏi mở khoá trong 60 giây"
          }
          wait_ui() {
            for n in $(seq 1 120); do
              adb logcat -d -s MEGATECH:D '*:S' > "$RUNNER_TEMP/ui-log.txt"
              if grep -q "\[UI\] moc=$1\$" "$RUNNER_TEMP/ui-log.txt"; then return 0; fi
              sleep 1
            done
            echo "::error::chup: thiếu mốc $1"; grep -F '[UI]' "$RUNNER_TEMP/ui-log.txt" | tail -10 || true
            adb exec-out screencap -p > "$OUT/loi-$1.png" || true
            # App văng: in lỗi (chỉ tên lớp/hàm của app, không có số liệu).
            adb logcat -d -b crash | grep -E 'FATAL|Exception|Error|at vn\.megatech|Caused by' | head -40 || true
            exit 1
          }
          for mode in sang toi; do
            if [[ "$mode" == toi ]]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi
            adb shell am force-stop "$pkg"
            adb logcat -c
            dismiss_keyguard
            adb shell am start -n "$component" -e base "$base" -e session "$TOKEN" -e secure 0 -e tour giaodien >/dev/null
            unlock_app
            for stage in "${ui_stages[@]}"; do
              wait_ui "$stage"
              adb exec-out screencap -p > "$OUT/a-$mode-$stage.png"
            done
            wait_ui xong
            adb logcat -d -s MEGATECH:D '*:S' | grep -F '[UI]' > "$OUT/moc-$mode.txt" || true
          done
          adb shell cmd uimode night no
          n=$(ls "$OUT"/a-*.png | wc -l)
          [[ "$n" == $(( ${#ui_stages[@]} * 2 )) ]] || { echo "::error::chup: thiếu ảnh ($n)"; exit 1; }
          echo "chup: đủ $n ảnh"
          BASH
          bash -n "$RUNNER_TEMP/chup.sh"
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chụp giao diện sáng và tối
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/chup.sh"
      - name: Thu log web ảo
        if: always()
        run: |
          mkdir -p "$OUT"
          # Chỉ giữ phương thức, đường dẫn không query và mã HTTP.
          if [ -f "$RUNNER_TEMP/web-ao.log" ]; then
            tail -200 "$RUNNER_TEMP/web-ao.log" | sed -nE 's/.*(GET|POST|HEAD) (\/[^ ?]*)[^ ]* ([0-9]{3}).*/web-ao: \1 \2 \3/p' > "$OUT/web-ao.log"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-preview
          path: ${{ env.OUT }}
          retention-days: 7
          if-no-files-found: warn
      - name: Đẩy ảnh lên nhánh android-preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d "$OUT" ] && ls "$OUT"/* >/dev/null 2>&1 || exit 0
          cd "$OUT"
          git init -q
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "Xem trước app Android từ commit $GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push -q --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/android-preview
      - name: Dừng web ảo
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/web-ao.pid" ] || exit 0
          python3 - "$RUNNER_TEMP/web-ao.pid" <<'PY'
          from os import killpg
          from signal import SIGTERM
          from sys import argv
          from pathlib import Path
          try:
              killpg(int(Path(argv[1]).read_text()), SIGTERM)
          except ProcessLookupError:
              pass
          PY
