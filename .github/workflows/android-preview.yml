        run: |
          set -Eeuo pipefail
          trap 'echo "::error::4-so-cung-ky: ghép xem riêng thất bại, mã=$?"; exit 1' ERR
          out="$RUNNER_TEMP/video"
          printf "file '%s'\n" "$out/4-so-cung-ky.mp4" "$out/4-so-cung-ky-rieng.mp4" > "$RUNNER_TEMP/focus-concat.txt"
          ffmpeg -v error -f concat -safe 0 -i "$RUNNER_TEMP/focus-concat.txt" -c copy "$RUNNER_TEMP/compare-focus.mp4"
          mv "$RUNNER_TEMP/compare-focus.mp4" "$out/4-so-cung-ky.mp4"
          cat "$out/4-so-cung-ky-rieng.txt" >> "$out/4-so-cung-ky.txt"
