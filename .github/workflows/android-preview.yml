      - name: 5-team — câu báo các màn chưa lọc A8b
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 5-team-cau
      - name: Ghép câu báo A8b vào 5-team
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::5-team: ghép câu báo thất bại, mã=$?"; exit 1' ERR
          out="$RUNNER_TEMP/video"
          printf "file '%s'\n" "$out/5-team.mp4" "$out/5-team-cau.mp4" > "$RUNNER_TEMP/team-concat.txt"
          ffmpeg -v error -f concat -safe 0 -i "$RUNNER_TEMP/team-concat.txt" -c copy "$RUNNER_TEMP/team-complete.mp4"
          mv "$RUNNER_TEMP/team-complete.mp4" "$out/5-team.mp4"
          cat "$out/5-team-cau.txt" >> "$out/5-team.txt"
      - name: 4-so-cung-ky — dải chọn, mini và biểu đồ to A7c
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
