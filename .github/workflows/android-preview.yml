          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update >"$RUNNER_TEMP/ffmpeg-install.txt" 2>&1 || { echo '::error::1-khoa: không cập nhật được danh sách gói ffmpeg, số lần=1'; exit 1; }
            sudo apt-get install -y ffmpeg >>"$RUNNER_TEMP/ffmpeg-install.txt" 2>&1 || { echo '::error::1-khoa: không cài được ffmpeg, số gói=1'; exit 1; }
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo '::error::1-khoa: thiếu ffmpeg sau chuẩn bị, số lệnh=1'; exit 1; }
      - name: 1-khoa — hộp nổi và mở lại
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 1-khoa
      - name: 2-che — FLAG_SECURE
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 2-che
      - name: 6.4.9 — tên khóa lưu phiên
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 6.4.9
      - name: 6.4.10 — sao lưu tắt
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 6.4.10
      - name: 6.4.11 — host lạ
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          force-avd-creation: false
          api-level: 35
          arch: x86_64
          script: bash "$RUNNER_TEMP/case.sh" 6.4.11
      - name: Đăng xuất demo
        if: always()
        run: |
          trap 'echo "::error::dang-xuat: lệnh thất bại, mã=$?"; exit 1' ERR
          if [[ -f "$RUNNER_TEMP/cookies" ]]; then
            curl -fsS -b "$RUNNER_TEMP/cookies" -X POST https://demo.tonghopposmegatech.io.vn/api/auth/logout -o /dev/null 2>/dev/null
            rm -f "$RUNNER_TEMP/cookies"
          fi
      - name: Báo lỗi job quay
        if: failure()
        run: |
          trap 'echo "::error::quay: không ghi được kết quả kiểm, mã=$?"; exit 1' ERR
          mkdir -p "$RUNNER_TEMP/video"
          printf '%s\n' 'quay: có bước kiểm hoặc máy ảo thất bại, số job=1' > "$RUNNER_TEMP/video/ket-qua.txt"
          echo '::error::quay: có bước kiểm hoặc máy ảo thất bại, số job=1'
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-preview
          path: |
            ${{ runner.temp }}/video/*.mp4
            ${{ runner.temp }}/video/*.txt
            ${{ runner.temp }}/video/*.png
          retention-days: 7
          if-no-files-found: error
  day-video:
    needs: quay
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-preview
          path: ${{ runner.temp }}/artifact
      - name: Đẩy video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/publish"
          find "$RUNNER_TEMP/artifact" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.txt' \) -exec cp -- {} "$RUNNER_TEMP/publish/" \;
          cd "$RUNNER_TEMP/publish"
          git init
          git config user.name github-actions
          git config user.email 12
          git add -- '*.mp4' '*.txt'
          git commit -m 'Android preview'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/android-preview
