# Xem trước app iOS trên máy ảo (không cần Mac): build bản Debug cho iPhone Simulator trên macOS của GitHub, mở app với bản demo
# (số liệu ảo, demo.tonghopposmegatech.io.vn), quay video các bước: màn mở đầu logo, "Chào mừng trở lại" mở bằng
# Face ID (giả lập khớp mặt), vào app, rời app rồi quay lại (app khoá, phải Face ID), Face ID không khớp, rồi tự xem
# tab Tổng quan 4 bộ phận, trang từng bộ phận và các tab khác. Đoạn 5 lặp lại lượt xem đó với icon cũ (MEGATECH_ICONS=classic;
# bản cài dùng Reicon từ 10/10/2026) và ghép cạnh đoạn 4 thành so-sanh-icon.mp4: trái icon cũ, phải Reicon.
# Trước khi quay: kiểm thử chuỗi Format.swift (MEGATECH_FORMAT_TEST=1, số và ngày viết ra phải trùng code cũ từng ký tự).
# Đoạn 6 (6-widget) mở khung xem widget (MEGATECH_WIDGETS=1, số ảo, không đăng nhập), ảnh PNG từng thẻ widget ở thư mục widget/.
# Đoạn 7 (7-mo-nhanh, kế hoạch 1.2) mở app từ đầu hai lần liền nhau, góc trên có đồng hồ mili giây (MEGATECH_CLOCK=1): lần 1 như lần đầu trên máy (màn logo), lần 2 bỏ logo, hỏi Face ID ngay; mốc [MOC] app tự ghi ở 7-moc-app.txt.
# Đoạn 8 (8-tai-lai, kế hoạch 1.3) mở app với request đầu tiên mỗi đường dẫn báo mất mạng (MEGATECH_FAIL_NET=once): khung lỗi có nút Thử lại, app tự bấm Thử lại, quay lại tab trong 60 giây không tải lại; mốc tải từng màn ở 8-moc-app.txt.
# Đoạn 9 (9-ky-pos, kế hoạch 1.4) đổi kỳ bằng chip 1 chạm, đổi POS, nhóm đơn, mở trang Vận đơn, rồi rời app, tắt hẳn app và mở lại: vẫn đúng tab, trang, kỳ, POS; dòng [NHO] app tự ghi ở 9-nho-app.txt.
# Đoạn 10 (10-cham-so, kế hoạch 1.6) chọn 1 POS + nhóm Gentadox, chạm một nhân viên: danh sách đơn giữ kỳ, POS, nhóm đơn, người bán; thẻ Vận đơn mở bảng giải thích; ô Đồng bộ mở Thông báo ở Đồng bộ Pancake; dòng [CHAM] app tự ghi ở 10-cham-so-app.txt.
# Đoạn 11 (11-tim, kế hoạch 1.5) gõ vào ô tìm tab Đơn hàng SĐT của một đơn tháng trước, SĐT của một đơn Mới (dạng +84), một mã đơn, một tên 3 chữ cái rồi mở Hồ sơ khách với tên đó (MEGATECH_TOUR_SEARCH=1); mốc thời gian từng lượt tìm (chỉ loại từ khóa, không có từ khóa) ở 11-tim-app.txt.
# Kết quả ở mục Artifacts của lần chạy ("ios-preview", giữ 7 ngày) và ở nhánh ios-preview (ghi đè mỗi lần chạy).
# Chỉ để kiểm tra giao diện, không đăng bản app nào.
name: iOS preview

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
  workflow_dispatch:

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      OUT: ${{ github.workspace }}/preview
      BASE: https://demo.tonghopposmegatech.io.vn
      BUNDLE: vn.megatech.tonghoppos
    steps:
      - uses: actions/checkout@v4

      # Dùng Xcode mặc định của máy GitHub (luôn có sẵn máy ảo iPhone đi kèm).
      - name: Build Debug cho máy ảo
        working-directory: ios/Megatech
        run: |
          xcodebuild -version
          set +e
          xcodebuild -project Megatech.xcodeproj -target Megatech -sdk iphonesimulator -configuration Debug \
            SYMROOT="$RUNNER_TEMP/sym" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          set -e
          grep -E 'error:|BUILD' "$RUNNER_TEMP/build.log" | sort -u | head -60 || true
          [ "$STATUS" -eq 0 ] || { tail -60 "$RUNNER_TEMP/build.log"; exit "$STATUS"; }
          # Ký tạm "-" như Xcode "Sign to Run Locally": app chưa ký thì máy ảo không cho dùng Keychain (không giữ được phiên).
          codesign -dv "$RUNNER_TEMP/sym/Debug-iphonesimulator/Megatech.app" 2>&1 | grep -E 'Identifier|Signature' || true

      - name: Mở máy ảo iPhone
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rows = [(k, x) for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pro = [r for r in rows if r[1]["name"].endswith(" Pro")] or rows
          pro.sort(key=lambda r: (r[0], r[1]["name"]))
          print(pro[-1][1]["udid"])
          ')"
          xcrun simctl list devices available | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          # Cài Face ID cho máy ảo (để app dùng được Face ID; khớp / không khớp giả lập bằng notifyutil).
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged
          xcrun simctl install "$UDID" "$RUNNER_TEMP/sym/Debug-iphonesimulator/Megatech.app"
          # Chạy thử một lượt rồi tắt (chưa có phiên nên không hỏi Face ID): lần mở đầu tiên sau khi bật máy ảo rất chậm,
          # làm lệnh giả lập Face ID tới trễ, hộp Face ID hết giờ. Làm ấm trước để lúc quay chạy đúng nhịp.
          time xcrun simctl launch "$UDID" "$BUNDLE" > /dev/null
          sleep 25
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          # Lệnh notifyutil vô hại (không gửi "không khớp" ở đây: máy ảo giữ kết quả đó cho lần hỏi Face ID kế tiếp).
          time xcrun simctl spawn "$UDID" notifyutil -p vn.megatech.preview.warmup
          time xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
          sleep 8
          xcrun simctl terminate "$UDID" com.apple.Preferences || true

      - name: Kiểm thử chuỗi số và ngày (Format.swift)
        run: |
          # MEGATECH_FORMAT_TEST=1 (chỉ bản Debug): app chạy bộ số mẫu qua code cũ và hàm mới ở Format.swift, in từng ca lệch
          # "FORMAT_TEST FAIL …" rồi "FORMAT_TEST OK <n> cases" và thoát, trước giao diện và trước mạng. Lệch một ký tự là đỏ.
          # Máy macOS không có sẵn timeout thì dùng perl (alarm) thay.
          command -v timeout > /dev/null || timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          out="$(SIMCTL_CHILD_MEGATECH_FORMAT_TEST=1 timeout 120 xcrun simctl launch --console-pty "$UDID" "$BUNDLE" 2>&1 || true)"
          echo "$out" | grep FORMAT_TEST || { echo "$out" | tail -40; echo "::error::App không in FORMAT_TEST."; exit 1; }
          echo "$out" | grep -q "FORMAT_TEST OK" || exit 1

      - name: Kiểm thử giải mã
        run: |
          command -v timeout > /dev/null || timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          out="$(SIMCTL_CHILD_MEGATECH_DECODE_TEST=1 timeout 120 xcrun simctl launch --console-pty "$UDID" "$BUNDLE" 2>&1 || true)"
          echo "$out" | grep DECODE_TEST || { echo "$out" | tail -40; echo "::error::App không in DECODE_TEST."; exit 1; }
          echo "$out" | grep -q "DECODE_TEST OK" || exit 1

      - name: Phiên đăng nhập bản demo
        run: |
          # Tài khoản demo công khai (mật khẩu in sẵn trên trang đăng nhập demo). Không in token ra log.
          TOKEN="$(curl -sS -c - -o /dev/null -H 'content-type: application/json' \
            -d '{"email":"chu@demo.megatech.vn","password":"demo@2026","remember":true}' "$BASE/api/auth/login" | awk '$6=="thp_session"{print $7}')"
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"; echo "Có phiên demo."; else echo "::warning::Không lấy được phiên demo, chỉ quay màn đăng nhập."; fi

      - name: Quay video các bước
        run: |
          mkdir -p "$OUT"
          command -v ffmpeg > /dev/null || brew install ffmpeg > /dev/null
          now() { python3 -c 'import time; print("%.2f" % time.time())'; }
          T0="$(now)"
          # Mốc thời gian (giây tính từ lúc bắt đầu) để tìm đúng khung hình trong video.
          mark() { python3 -c "import time; print('%.1f' % (time.time() - $T0))" | tr -d '\n' >> "$OUT/moc-thoi-gian.txt"; echo " $1" >> "$OUT/moc-thoi-gian.txt"; }
          face() { xcrun simctl spawn "$UDID" notifyutil -p "com.apple.BiometricKit_Sim.pearl.$1"; }
          # Như máy đã từng đăng nhập: có phiên + nhớ email (tài khoản demo công khai, qua tham số -thp_last_email của UserDefaults)
          # để hiện "Chào mừng trở lại" với email đã che. App đang chạy nền thì lệnh này chỉ đưa app lên lại (không mở mới).
          # MEGATECH_FPS=20: hiệu ứng chạy 20 khung hình/giây (chỉ bản Debug) để máy ảo chậm còn sức nhận lệnh giả lập Face ID.
          open_app() { SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
            xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null; }
          leave() { xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null; }
          # Quay từng đoạn riêng (đoạn nào hỏng không mất cả video).
          rec() { xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/$1.mp4" > /dev/null 2>&1 & REC=$!; sleep 4; mark "quay-$1"; }
          stop() { kill -INT "$REC"; wait "$REC" || true; sleep 2; }
          # 1. Mở app từ đầu: màn mở đầu logo rồi "Chào mừng trở lại" tự hỏi Face ID → khớp → linh vật vui → vào app.
          # Gửi "khớp" hai lần phòng khi lần đầu tới trước lúc hộp Face ID hiện (không có hộp thì lệnh không có tác dụng).
          rec 1-mo-app
          open_app; mark "mo-app"
          sleep 14; mark "face-id-khop"; face match
          sleep 10; mark "face-id-khop-2"; face match
          sleep 8; stop
          # 2. Rời app rồi quay lại: app phải khoá ngay và tự hỏi Face ID → khớp → vào lại.
          rec 2-quay-lai
          leave; mark "roi-app"; sleep 4
          open_app; mark "quay-lai"; sleep 6
          mark "face-id-khop"; face match
          sleep 8; mark "face-id-khop-2"; face match; sleep 6
          stop
          # 3. Rời app lần nữa, Face ID không khớp.
          rec 3-face-id-sai
          leave; mark "roi-app"; sleep 4
          open_app; mark "quay-lai"; sleep 6
          mark "face-id-sai"; face nomatch; sleep 3; mark "face-id-sai-2"; face nomatch; sleep 8
          stop
          # 4. Mở lại app từ đầu với MEGATECH_TOUR=1 (chỉ bản Debug): sau Face ID, app tự cuộn 4 bảng bộ phận ở tab Tổng quan,
          # mở trang Vận đơn, Sale, CSKH, rồi qua các tab Cảnh báo, Trong ngày, Nhân sự, Thêm (máy ảo không chạm được).
          rec 4-tong-quan
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 2
          SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 SIMCTL_CHILD_MEGATECH_TOUR=1 \
            xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null; mark "mo-app-tour"
          sleep 14; mark "face-id-khop"; face match
          sleep 10; mark "face-id-khop-2"; face match
          sleep 80; stop; mark "het-4"
          # 5. Cùng lượt xem như đoạn 4 nhưng vẽ icon cũ (MEGATECH_ICONS=classic, chỉ bản Debug), để so với Reicon.
          rec 5-icon-cu
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 2
          SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 SIMCTL_CHILD_MEGATECH_TOUR=1 SIMCTL_CHILD_MEGATECH_ICONS=classic \
            xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null; mark "mo-app-icon-cu"
          sleep 14; mark "face-id-khop"; face match
          sleep 10; mark "face-id-khop-2"; face match
          sleep 80; stop; mark "het"
          # 6. Khung xem widget (MEGATECH_WIDGETS=1, chỉ bản Debug): các trạng thái widget bản thử và bố cục dự kiến (số ảo),
          # tự cuộn qua mọi mục; mỗi thẻ được app xuất ra PNG trong Documents/widget-gallery.
          rec 6-widget
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 2
          SIMCTL_CHILD_MEGATECH_WIDGETS=1 SIMCTL_CHILD_MEGATECH_FPS=20 SIMCTL_CHILD_MEGATECH_NO_INTRO=1 \
            xcrun simctl launch "$UDID" "$BUNDLE" > /dev/null; mark "mo-khung-widget"
          sleep 35; stop; mark "het-6"
          mkdir -p "$OUT/widget"
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data 2>/dev/null || true)"
          if [ -n "$DATA" ] && ls "$DATA/Documents/widget-gallery/"*.png > /dev/null 2>&1; then
            cp "$DATA/Documents/widget-gallery/"*.png "$OUT/widget/"; ls "$OUT/widget"
          else
            echo "::warning::Không thấy ảnh widget trong Documents/widget-gallery."
          fi
          # 7. Mở app nhanh (kế hoạch 1.2): hai lần mở app từ đầu liền nhau, góc trên có đồng hồ mili giây từ lúc mở app kèm các mốc
          # (MEGATECH_CLOCK=1, chỉ bản Debug). Lần 1 như lần đầu trên máy (MEGATECH_INTRO_RESET=1): màn logo → "Chào mừng trở lại" →
          # Face ID → vào app. Lần 2: bỏ logo, hỏi Face ID ngay; số (tải trước lúc hộp Face ID đang hiện) chỉ hiện sau Face ID khớp.
          # Mốc app tự ghi ("[MOC] <tên> <mili giây từ lúc tiến trình chạy>", không có số liệu) lấy từ stdout của app (--stdout).
          # $1 = file nhận stdout của app; $2 = 1 thì như lần đầu trên máy. simctl không nhận --stdout thì mở lại không lấy log.
          # perl alarm 15 giây chỉ để chặn treo (lệnh launch có --stdout bình thường trả về ngay, không chờ app).
          launch_clock() {
            local vars=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
              SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_INTRO_RESET="${2:-0}")
            env "${vars[@]}" perl -e 'alarm shift; exec @ARGV' 15 xcrun simctl launch --stdout="$1" "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null \
              || env "${vars[@]}" xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null
          }
          # Khớp Face ID như người thật (đoạn 7–11): chờ app ghi mốc hoi-face-id vào stdout ($1), 1 giây sau gửi "khớp"; chưa thấy
          # face-id-dung sau 3 giây thì gửi lại (tối đa 3 lần). Video không còn cảnh đứng chờ lệnh giả lập ở hộp Face ID.
          # Không có log (simctl không nhận --stdout) thì gửi "khớp" theo giờ cố định như các đoạn 1–6.
          face_on_ask() {
            local i n
            for i in $(seq 1 100); do grep -q 'hoi-face-id' "$1" 2> /dev/null && break; sleep 0.2; done
            if ! grep -q 'hoi-face-id' "$1" 2> /dev/null; then
              mark "face-id-khop-gio-co-dinh"; face match; sleep 5; face match; return 0
            fi
            for n in 1 2 3; do
              sleep 1; mark "face-id-khop-$n"; face match
              for i in $(seq 1 15); do grep -q 'face-id-dung' "$1" 2> /dev/null && return 0; sleep 0.2; done
            done
          }
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 7-mo-nhanh
          launch_clock "$RUNNER_TEMP/moc-7-1.txt" 1; mark "mo-app-lan-1-co-logo"
          face_on_ask "$RUNNER_TEMP/moc-7-1.txt"
          sleep 6; xcrun simctl terminate "$UDID" "$BUNDLE" || true; mark "tat-app"; sleep 2
          launch_clock "$RUNNER_TEMP/moc-7-2.txt"; mark "mo-app-lan-2-bo-logo"
          face_on_ask "$RUNNER_TEMP/moc-7-2.txt"
          sleep 8; stop; mark "het-7"
          {
            echo "Lan 1 (nhu lan dau tren may, co man logo):"; grep -h '\[MOC\]' "$RUNNER_TEMP/moc-7-1.txt" 2>/dev/null || echo "(khong co log)"
            echo "Lan 2 (bo man logo):"; grep -h '\[MOC\]' "$RUNNER_TEMP/moc-7-2.txt" 2>/dev/null || echo "(khong co log)"
          } > "$OUT/7-moc-app.txt"
          cat "$OUT/7-moc-app.txt"
          # 8. Tải lại (kế hoạch 1.3): mở app từ đầu với MEGATECH_FAIL_NET=once (chỉ bản Debug: request đầu tiên của mỗi đường dẫn
          # báo mất mạng, trừ đăng nhập) và MEGATECH_TOUR=reload: Tổng quan hiện khung lỗi "Mất mạng, kiểm tra kết nối" có nút
          # Thử lại → cuộn xuống khối Số liệu theo kỳ (khung lỗi, số phần chưa tải được) → app tự "bấm" Thử lại, các nguồn tải lại
          # cùng lúc → Trang chủ (nguồn chưa hỏi lần nào báo lỗi, tự Thử lại) → quay lại Tổng quan trong 60 giây: không tải lại.
          # Góc trên có đồng hồ mili giây (MEGATECH_CLOCK=1). Mốc tải từng màn app tự ghi ("[MOC] tai <màn> bat-dau | xong | huy |
          # bo-qua", số request, số request chạy cùng lúc nhiều nhất; không có số liệu) ở 8-moc-app.txt. Bỏ logo (đoạn 7 đã vào app);
          # khớp Face ID khi app hỏi (face_on_ask).
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 8-tai-lai
          vars8=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
            SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_TOUR=reload SIMCTL_CHILD_MEGATECH_FAIL_NET=once)
          env "${vars8[@]}" perl -e 'alarm shift; exec @ARGV' 15 xcrun simctl launch --stdout="$RUNNER_TEMP/moc-8.txt" "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null \
            || env "${vars8[@]}" xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null
          mark "mo-app-loi-mang-lan-dau"
          face_on_ask "$RUNNER_TEMP/moc-8.txt"
          sleep 33; stop; mark "het-8"
          {
            echo "Tai lai (MEGATECH_FAIL_NET=once, MEGATECH_TOUR=reload):"; grep -h '\[MOC\]' "$RUNNER_TEMP/moc-8.txt" 2>/dev/null || echo "(khong co log)"
          } > "$OUT/8-moc-app.txt"
          cat "$OUT/8-moc-app.txt"
          # 9. Nhớ kỳ và POS (kế hoạch 1.4). Lần 1 (MEGATECH_NAV_RESET=1: bắt đầu từ Tổng quan, Hôm nay, tất cả POS như sau khi
          # đăng xuất; MEGATECH_TOUR=kypos): sau Face ID app tự "chạm" chip Tháng này → POS Thủy sản → nhóm Gentadox → mở trang
          # Vận đơn (dòng "Đang xem: Tháng này · … · POS Thủy sản Megatech"). Rời app (iOS lưu đường đi khi app vào nền), tắt hẳn
          # app, mở lại (MEGATECH_TOUR=kypos-mo-lai): vẫn trang Vận đơn, cùng kỳ, POS → về Tổng quan (chip vẫn Tháng này, Thủy sản,
          # Gentadox) → tab Đơn hàng (cũng Tháng này). Bỏ logo (đã vào app ở đoạn trước); khớp Face ID khi app hỏi (face_on_ask).
          # Dòng app tự ghi khi vào app ("[NHO] mo-app tab=… ky=… pos=… nhom=… trang=…": chỉ mã tab, kỳ, POS và số trang mở lại;
          # không có số liệu hay dữ liệu cá nhân) ở 9-nho-app.txt.
          launch_nho() {
            local vars=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
              SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_TOUR="$2" SIMCTL_CHILD_MEGATECH_NAV_RESET="$3")
            env "${vars[@]}" perl -e 'alarm shift; exec @ARGV' 15 xcrun simctl launch --stdout="$1" "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null \
              || env "${vars[@]}" xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null
          }
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 9-ky-pos
          launch_nho "$RUNNER_TEMP/nho-9-1.txt" kypos 1; mark "mo-app-doi-ky-pos"
          face_on_ask "$RUNNER_TEMP/nho-9-1.txt"
          sleep 16; mark "da-mo-van-don"
          leave; mark "roi-app"; sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; mark "tat-han-app"; sleep 2
          launch_nho "$RUNNER_TEMP/nho-9-2.txt" kypos-mo-lai 0; mark "mo-lai-app"
          face_on_ask "$RUNNER_TEMP/nho-9-2.txt"
          sleep 14; stop; mark "het-9"
          {
            echo "Lan 1 (bat dau tu mac dinh):"; grep -h '\[NHO\]' "$RUNNER_TEMP/nho-9-1.txt" 2>/dev/null || echo "(khong co log)"
            echo "Lan 2 (sau khi tat han app):"; grep -h '\[NHO\]' "$RUNNER_TEMP/nho-9-2.txt" 2>/dev/null || echo "(khong co log)"
          } > "$OUT/9-nho-app.txt"
          cat "$OUT/9-nho-app.txt"
          # 10. Chạm số mở đúng trang, giữ bộ lọc (kế hoạch 1.6). MEGATECH_NAV_RESET=1 (bắt đầu từ Tổng quan, Hôm nay, tất cả POS)
          # và MEGATECH_TOUR=chamso (chỉ bản Debug): sau Face ID app tự "chạm" chip Tháng trước → POS Thủy sản → nhóm Gentadox →
          # cuộn tới khối Nhân viên → "chạm" người đầu bảng TOP 5: danh sách đơn chốt của người đó giữ kỳ, POS, nhóm đơn, người bán,
          # đầu danh sách ghi "Lọc theo ngày xác nhận, có thể ít hơn số trên thẻ" → trang Vận đơn, "chạm" thẻ Đơn chuyển đi: bảng
          # giải thích (đếm gì, mốc ngày gửi hàng, phạm vi) → về Tổng quan, "chạm" ô Đồng bộ ở thanh đầu: Thông báo cuộn tới Đồng bộ
          # Pancake. Góc trên có đồng hồ mili giây (MEGATECH_CLOCK=1). Bỏ logo (đã vào app ở đoạn trước); khớp Face ID khi app hỏi (face_on_ask).
          # Dòng app tự ghi ("[CHAM] cham-nhan-vien …" là bộ lọc của khối Nhân viên, "[CHAM] danh-sach …" là bộ lọc của danh sách vừa
          # mở: chỉ ngày, mã POS, nhóm đơn, bộ phận, có lọc theo người bán hay không; không có tên, SĐT, mã người) ở 10-cham-so-app.txt.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 10-cham-so
          vars10=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
            SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_TOUR=chamso SIMCTL_CHILD_MEGATECH_NAV_RESET=1)
          env "${vars10[@]}" perl -e 'alarm shift; exec @ARGV' 15 xcrun simctl launch --stdout="$RUNNER_TEMP/cham-10.txt" "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null \
            || env "${vars10[@]}" xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null
          mark "mo-app-cham-so"
          face_on_ask "$RUNNER_TEMP/cham-10.txt"
          sleep 37; stop; mark "het-10"
          {
            echo "Cham so giu bo loc (MEGATECH_TOUR=chamso):"; grep -h '\[CHAM\]' "$RUNNER_TEMP/cham-10.txt" 2>/dev/null || echo "(khong co log)"
          } > "$OUT/10-cham-so-app.txt"
          cat "$OUT/10-cham-so-app.txt"
          # 11. Sửa ô tìm (kế hoạch 1.5). MEGATECH_NAV_RESET=1 và MEGATECH_TOUR_SEARCH=1 (chỉ bản Debug): sau Face ID app tự lấy mẫu từ
          # site demo (SĐT của một đơn tạo tháng trước, SĐT của một đơn đang ở trạng thái Mới, mã của một đơn (xem dưới), một tên
          # khách 3 chữ cái; chỉ giữ trong bộ nhớ, không in ra log), qua tab Đơn hàng, kỳ Tháng này, rồi "gõ" lần lượt vào ô tìm ở
          # đầu trang: SĐT đơn tháng trước (dạng 09xx.xxx.xxx) → SĐT đơn Mới (dạng +84 9xx xxx xxx) → mã đơn (#…) → tên 3 chữ cái
          # (tìm trong kỳ đang xem, có "Tìm trong Hồ sơ khách") → mở Hồ sơ khách với tên đó. SĐT tìm trong mọi đơn, mọi POS; mã đơn
          # mọi POS, trong kỳ đang xem cho tới khi web tra mã theo khóa chính (SearchText.codesByKey; trong lúc đó mẫu mã đơn lấy từ một
          # đơn chốt tháng này, không phải tháng trước).
          # Góc trên có đồng hồ mili giây (MEGATECH_CLOCK=1). Bỏ logo (đã vào app ở đoạn trước); khớp Face ID khi app hỏi (face_on_ask).
          # Dòng app tự ghi ("[MOC] tim <nơi tìm> <phone|code|name> <kết quả> <mili giây>": chỉ loại từ khóa và thời gian, không có
          # từ khóa, SĐT, tên; "[MOC] tim mau …": có lấy được từng mẫu hay không) ở 11-tim-app.txt.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 11-tim
          vars11=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
            SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_TOUR_SEARCH=1 SIMCTL_CHILD_MEGATECH_NAV_RESET=1)
          env "${vars11[@]}" perl -e 'alarm shift; exec @ARGV' 15 xcrun simctl launch --stdout="$RUNNER_TEMP/tim-11.txt" "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null \
            || env "${vars11[@]}" xcrun simctl launch "$UDID" "$BUNDLE" -thp_last_email chu@demo.megatech.vn > /dev/null
          mark "mo-app-tim"
          face_on_ask "$RUNNER_TEMP/tim-11.txt"
          sleep 30; stop; mark "het-11"
          {
            echo "Tim (MEGATECH_TOUR_SEARCH=1; chi loai tu khoa va thoi gian):"; grep -h '\[MOC\] tim' "$RUNNER_TEMP/tim-11.txt" 2>/dev/null || echo "(khong co log)"
          } > "$OUT/11-tim-app.txt"
          cat "$OUT/11-tim-app.txt"
          # 12. I3/I4: bảng Sale/CSKH, XN kho, dải so, ba mini; kỳ Tháng trước, thêm Hôm nay.
          # Chỉ giữ log số giả [XNK], không chép log thô vào artifact.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true; sleep 1
          rec 12-xn-kho
          vars12=(SIMCTL_CHILD_MEGATECH_BASE="$BASE" SIMCTL_CHILD_MEGATECH_SESSION="${TOKEN:-}" SIMCTL_CHILD_MEGATECH_FPS=20 \
            SIMCTL_CHILD_MEGATECH_CLOCK=1 SIMCTL_CHILD_MEGATECH_TOUR=xnkho SIMCTL_CHILD_MEGATECH_NAV_RESET=1)
          env "${vars12[@]}" xcrun simctl launch --stdout="$RUNNER_TEMP/xnk-12.txt" "$UDID" "$BUNDLE" > /dev/null
          face_on_ask "$RUNNER_TEMP/xnk-12.txt"
          wait_xnk() {
            local i
            for i in $(seq 1 300); do
              if grep -q "\[XNK\] moc=$1" "$RUNNER_TEMP/xnk-12.txt"; then sleep 1; return 0; fi
              sleep 0.2
            done
            echo "::error::Thiếu mốc XNK: $1"; return 1
          }
          wait_xnk cot
          xcrun simctl io "$UDID" screenshot "$OUT/12-sale.png"
          wait_xnk giai-thich
          xcrun simctl io "$UDID" screenshot "$OUT/12-giai-thich.png"
          wait_xnk ds
          xcrun simctl io "$UDID" screenshot "$OUT/12-don-xn-kho.png"
          wait_xnk cskh
          xcrun simctl io "$UDID" screenshot "$OUT/12-cskh.png"
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          wait_xnk chu-lon
          xcrun simctl io "$UDID" screenshot "$OUT/12-chu-lon.png"
          xcrun simctl ui "$UDID" content_size large
          for stage in controls wave diff cum weekday rate custom today today-mini; do
            wait_xnk "$stage"
            xcrun simctl io "$UDID" screenshot "$OUT/12-so-$stage.png"
          done
          stop; mark "het-12"
          # 6.2.6–8: chỉ đọc lựa chọn app đã lưu; ngày custom phải bootstrap từ API.
          launch_xnk_case() {
            local test="$1" zone="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            : > "$RUNNER_TEMP/xnk-12.txt"
            env "${vars12[@]}" SIMCTL_CHILD_MEGATECH_XNK_CASE="$test" SIMCTL_CHILD_TZ="$zone" \
              xcrun simctl launch --stdout="$RUNNER_TEMP/xnk-12.txt" "$UDID" "$BUNDLE" > /dev/null
            face_on_ask "$RUNNER_TEMP/xnk-12.txt"
            wait_xnk "$test"
            xcrun simctl io "$UDID" screenshot "$OUT/12-so-$test.png"
          }
          cp "$RUNNER_TEMP/xnk-12.txt" "$RUNNER_TEMP/xnk-12-tour.txt"
          launch_xnk_case reopen-custom Asia/Ho_Chi_Minh
          grep -E '\[XNK\] so mode=custom .*cs=[0-9-]+ ce=[0-9-]+' "$RUNNER_TEMP/xnk-12.txt" > "$OUT/12-custom-reopen-app.txt"
          cp "$RUNNER_TEMP/xnk-12.txt" "$RUNNER_TEMP/xnk-12-reopen.txt"
          launch_xnk_case timezone America/New_York
          grep -E '\[XNK\] so mode=custom .*cs=[0-9-]+ ce=[0-9-]+' "$RUNNER_TEMP/xnk-12.txt" > "$OUT/12-custom-timezone-app.txt"
          # Kiểm cùng hai ngày khi đổi múi giờ; không chép log thô hay dữ liệu cá nhân.
          sed -nE 's/.*cs=([0-9-]+) ce=([0-9-]+).*/\1 \2/p' "$OUT/12-custom-reopen-app.txt" | tail -1 > "$RUNNER_TEMP/xnk-dates-vn.txt"
          sed -nE 's/.*cs=([0-9-]+) ce=([0-9-]+).*/\1 \2/p' "$OUT/12-custom-timezone-app.txt" | tail -1 > "$RUNNER_TEMP/xnk-dates-ny.txt"
          diff "$RUNNER_TEMP/xnk-dates-vn.txt" "$RUNNER_TEMP/xnk-dates-ny.txt"
          cp "$RUNNER_TEMP/xnk-12.txt" "$RUNNER_TEMP/xnk-12-timezone.txt"
          launch_xnk_case remember-set Asia/Ho_Chi_Minh
          grep -E '\[XNK\] so mode=weekday step=2 kind=diff' "$RUNNER_TEMP/xnk-12.txt" > "$OUT/12-remember-set-app.txt"
          cp "$RUNNER_TEMP/xnk-12.txt" "$RUNNER_TEMP/xnk-12-set.txt"
          launch_xnk_case remember-reopen Asia/Ho_Chi_Minh
          # Dòng so đầu tiên phải giữ cả ba giá trị, trước mọi lệnh đổi lựa chọn.
          grep '\[XNK\] so ' "$RUNNER_TEMP/xnk-12.txt" | head -1 | grep 'mode=weekday step=2 kind=diff' > "$OUT/12-remember-reopen-app.txt"
          grep -h '\[XNK\]' "$RUNNER_TEMP/xnk-12-tour.txt" "$RUNNER_TEMP/xnk-12-reopen.txt" "$RUNNER_TEMP/xnk-12-timezone.txt" "$RUNNER_TEMP/xnk-12-set.txt" "$RUNNER_TEMP/xnk-12.txt" > "$OUT/12-xn-kho-app.txt"
          cat "$OUT/12-xn-kho-app.txt"
          # Cờ Face ID mỗi lần vào app ở đoạn 7–11: lúc Face ID đúng, lúc vào app, lúc app active lại, có chạm trần giữ cờ hay không
          # (chỉ tên mốc và mili giây) ở co-face-id.txt, để soi chỗ màn che chớp lên ngay sau Face ID.
          for f in moc-7-1 moc-7-2 moc-8 nho-9-1 nho-9-2 cham-10 tim-11; do
            echo "$f: $(grep -hoE '\[MOC\] (face-id-dung|vao-app|active-lai-sau-face-id|co-face-id-het-tran) [0-9]+' "$RUNNER_TEMP/$f.txt" 2> /dev/null | sed 's/\[MOC\] //' | tr '\n' ' ')"
          done > "$OUT/co-face-id.txt"
          cat "$OUT/co-face-id.txt"
          cat "$OUT/moc-thoi-gian.txt"
          # Tắt máy ảo rồi thu nhỏ video cho nhẹ (480 px; đoạn mở app thêm bản 720 px để soi màn mở đầu).
          xcrun simctl shutdown "$UDID" || true
          for f in 1-mo-app 2-quay-lai 3-face-id-sai 4-tong-quan 5-icon-cu 6-widget 7-mo-nhanh 8-tai-lai 9-ky-pos 10-cham-so 11-tim 12-xn-kho; do
            ffmpeg -v error -y -i "$RUNNER_TEMP/$f.mp4" -vf "scale=480:-2" -r 30 -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart -an "$OUT/$f.mp4" \
              || echo "::warning::Đoạn $f không đọc được."
          done
          ffmpeg -v error -y -i "$RUNNER_TEMP/1-mo-app.mp4" -t 40 -vf "scale=720:-2" -r 30 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an "$OUT/mo-dau-720.mp4" || true
          ffmpeg -v error -y -i "$RUNNER_TEMP/4-tong-quan.mp4" -vf "scale=720:-2" -r 30 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an "$OUT/tong-quan-720.mp4" || true
          # Đoạn 7 bản 720 px để đọc rõ đồng hồ mili giây ở góc trên.
          ffmpeg -v error -y -i "$RUNNER_TEMP/7-mo-nhanh.mp4" -vf "scale=720:-2" -r 30 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an "$OUT/mo-nhanh-720.mp4" || true
          # Trái: icon cũ (đoạn 5); phải: Reicon (đoạn 4, bản cài); cùng lượt xem, cùng nhịp.
          ffmpeg -v error -y -i "$RUNNER_TEMP/5-icon-cu.mp4" -i "$RUNNER_TEMP/4-tong-quan.mp4" \
            -filter_complex "[0:v]fps=30,scale=600:-2,setsar=1[a];[1:v]fps=30,scale=600:-2,setsar=1[b];[a][b]hstack=inputs=2:shortest=1[v]" -map "[v]" \
            -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an "$OUT/so-sanh-icon.mp4" || echo "::warning::Không ghép được video so sánh icon."
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-preview
          path: ${{ env.OUT }}
          retention-days: 7
          if-no-files-found: ignore

      # Đẩy video lên nhánh ios-preview (ghi đè mỗi lần) để xem được cả ở nơi không tải được artifact.
      - name: Đẩy video lên nhánh ios-preview
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$OUT"
          git init -q && git checkout -q -b ios-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Xem trước app iOS từ commit $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-preview

      - name: Đăng xuất phiên demo
        if: always()
        run: |
          [ -n "${TOKEN:-}" ] || exit 0
          curl -sS -o /dev/null -b "thp_session=$TOKEN" -H 'content-type: application/json' -d '{}' "$BASE/api/auth/logout" || true
