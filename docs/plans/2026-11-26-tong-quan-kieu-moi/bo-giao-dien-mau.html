<title>Bộ giao diện mẫu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: cửa sổ trắng bo tròn, menu ngang; MỌI trang dùng chung một khung: tiêu đề + bộ lọc, dải cần xem, hàng ô số, biểu đồ, bảng */
:root{--page:#ececee;--win:#fff;--card:#fff;--soft:#f8f9f8;--soft2:#f1f3f1;--line:#e9ecea;--fg:#17201b;--fg2:#56625c;--mute:#6b7771;--green:#0f6b55;--brand:#17684b;--teal:#13a184;--tint:#e6f3ec;--red:#c93a34;--redbg:#fdeceb;--amb:#9a6200;--ambbg:#fdf1dc;--track:#f3f4f3;--tip:#141a17;color-scheme:light}
:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px max(10px,env(safe-area-inset-right,0px)) 30px max(10px,env(safe-area-inset-left,0px));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.demo{max-width:1340px;margin:0 auto 10px;font-size:12.5px;color:var(--mute);text-align:center}
.win{background:var(--win);border-radius:22px;max-width:1340px;margin:0 auto;box-shadow:0 2px 20px rgba(0,0,0,.05);overflow:hidden}
.nav{display:flex;align-items:center;gap:4px;padding:14px 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;margin-right:12px;flex:none}
.lg{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.tab{padding:7px 13px;border-radius:999px;color:var(--fg2);font-weight:500;white-space:nowrap;flex:none}.tab:hover{background:var(--soft)}.tab.on{background:var(--soft2);color:var(--fg);font-weight:600}
.tab.kit{margin-left:auto;border:1px dashed #c9d2cc}
.body{padding:20px}
.h1{font-size:23px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.h1 small{display:block;font-size:12.5px;color:var(--mute);font-weight:400;letter-spacing:0}
.seg{font-size:12.5px;background:var(--soft2);border-radius:999px;padding:3px;display:inline-flex}
.seg button{padding:5px 12px;color:var(--mute);border-radius:999px;font-weight:500}.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}.pos::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--fg2);white-space:nowrap;flex:none}.chip.on{background:var(--fg);border-color:var(--fg);color:#fff;font-weight:600}
.card{border:1px solid var(--line);border-radius:20px;padding:18px 20px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mt{margin-top:16px}
.need{background:var(--redbg);border-radius:16px;padding:12px 14px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.need b{flex:1 1 260px;font-weight:600}.need b small{display:block;font-weight:400;color:var(--fg2);font-size:12.5px}
.btn{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;background:var(--card);white-space:nowrap}.btn:hover{background:var(--soft)}
.btn.p{background:var(--fg);border-color:var(--fg);color:#fff}.btn.g{background:var(--brand);border-color:var(--brand);color:#fff}.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.kpis{background:var(--soft);border-radius:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px 4px}
.kpis>button{padding:0 18px;border-left:1px solid var(--line);text-align:left;display:block}.kpis>button:first-child{border:0}
.kpis .t{color:var(--fg2);font-size:12.5px}.kpis b{font-size:25px;display:block;margin:5px 0 7px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.kpis b.bad{color:var(--red)}
.kpis em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);margin-top:6px}
.pill{font-size:12px;background:var(--tint);color:var(--brand);border-radius:8px;padding:2px 8px;font-weight:500;display:inline-block;white-space:nowrap}
.pill.r{background:var(--redbg);color:var(--red)}.pill.a{background:var(--ambbg);color:var(--amb)}.pill.g{background:var(--soft2);color:var(--fg2)}
.ct{font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.ct small{font-weight:400;font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.bars{display:flex;gap:clamp(3px,1vw,10px);height:170px;margin-top:14px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.tr{flex:1;width:100%;max-width:22px;background:var(--track);border-radius:11px;position:relative}.tr i{position:absolute;bottom:0;left:0;right:0;border-radius:11px;background:#c6cdc8}.bc.now .tr i{background:var(--green)}.bc.bad .tr i{background:var(--red)}
.bc span{font-size:11px;color:var(--mute);padding-top:6px;white-space:nowrap}.bc.now span{color:var(--fg);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(70px,130px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;padding:7px 0}
.hb i{display:block;height:10px;border-radius:5px;background:var(--track);position:relative}.hb i:after{content:"";position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal);width:var(--w)}.hb.bad i:after{background:var(--red)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}.hb.bad b{color:var(--red)}
.tw{overflow-x:auto;margin:12px -6px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th{font-size:11.5px;color:var(--mute);text-align:right;padding:8px 10px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
th:first-child,td:first-child{text-align:left}td:first-child{font-weight:500}
td.bad{color:var(--red);font-weight:700}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft2);font-size:11px;font-weight:700;margin-right:9px;color:var(--fg2)}
.tg{font-size:10.5px;background:var(--soft2);border-radius:9px;padding:1px 7px;color:var(--fg2);margin-left:6px;font-weight:500}
.list>div{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}.list>div:first-child{border:0}.list span{flex:1;min-width:0}.list span small{display:block;color:var(--mute);font-size:12px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld label{display:block;font-size:12px;color:var(--fg2);margin-bottom:5px;font-weight:500}.fld div{border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.sw{width:38px;height:22px;border-radius:11px;background:#cfd6d1;position:relative;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--brand)}.sw.on:after{left:18px}
.sk{background:linear-gradient(90deg,var(--soft2),var(--soft),var(--soft2));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px;height:14px}@keyframes sh{to{background-position:-200% 0}}
.warn{background:var(--ambbg);color:var(--amb);border-radius:12px;padding:9px 13px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lab{font-size:10.5px;letter-spacing:.06em;color:var(--brand);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.swt{display:flex;gap:8px;flex-wrap:wrap}.swt i{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:block}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.25s;z-index:10}.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:10px;right:10px;bottom:10px;width:min(400px,calc(100vw - 20px));background:var(--card);border-radius:20px;z-index:11;transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 40px rgba(0,0,0,.18);padding:18px;overflow-y:auto}.panel.on{transform:none}
.panel h3{margin:0 0 4px;font-size:17px}.x{float:right;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--mute)}.x:hover{background:var(--soft)}
.calc{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}.calc div{display:flex;justify-content:space-between;padding:4px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--tip);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;transition:.25s;z-index:30;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}.toast.on{opacity:1;transform:translate(-50%,0)}.toast u{color:#7fd6b0;text-decoration:none;font-weight:600}
@media (max-width:860px){.two,.grid3,.frm{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}.kpis>button:nth-child(3){border-left:0}.body{padding:14px}.card{padding:15px}.h1{font-size:20px}.tab.kit{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<p class="demo">Bộ giao diện mẫu · người và số liệu ảo · chưa sửa code · bấm từng mục trên menu để xem</p>
<div class="win">
  <div class="nav" id="nav"><div class="brand"><span class="lg">M</span>Megatech</div></div>
  <div class="body" id="body"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ppl=['Trần Minh Anh','Lê Quốc Bảo','Phạm Thu Cúc','Đỗ Hải Đăng','Vũ Ngọc Em','Hoàng Gia Phúc'];
const ini=n=>n.split(' ').slice(-2).map(x=>x[0]).join('');
const who=(n,suf,t)=>`<span class="av">${ini(n)}</span>${n} ${suf}${t?`<span class="tg">${t}</span>`:''}`;
const bars=(a,bad)=>`<div class="bars">${a.map((v,i)=>`<div class="bc ${i==a.length-1?'now':''} ${bad&&v>=bad?'bad':''}"><div class="tr"><i style="height:${v}%"></i></div><span>${20+i}/11</span></div>`).join('')}</div>`;
const hb=(rows)=>rows.map(([n,v,w,bad])=>`<div class="hb ${bad?'bad':''}"><span>${n}</span><i style="--w:${w}%"></i><b>${v}</b></div>`).join('');
const kp=(a)=>`<div class="kpis">${a.map(([t,v,p,pc,e,bad])=>`<button onclick="why('${t}','${v}')"><span class="t">${t}</span><b class="${bad?'bad':''}">${v}</b><span class="pill ${pc||''}">${p}</span><em>${e}</em></button>`).join('')}</div>`;
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr onclick="why('${r[0].replace(/<[^>]+>/g,'').trim()}','')">${r.map(c=>Array.isArray(c)?`<td class="bad">${c[0]}</td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const head=(t,s,noPos)=>`<div class="h1"><div>${t}<small>${s}</small></div><div class="seg"><button>Hôm nay</button><button class="on">7 ngày</button><button>Tháng này</button></div></div>${noPos?'':`<div class="pos"><button class="chip on">Tất cả POS</button><button class="chip">POS Mẫu A</button><button class="chip">POS Mẫu B</button><button class="chip">POS Mẫu C</button><button class="chip">POS Mẫu D</button></div>`}`;
const need=(t,s,b)=>`<div class="need"><b>${t}<small>${s}</small></b><button class="btn p" onclick="toast('Đã mở danh sách')">${b}</button></div>`;
const P={
'Tổng quan':()=>head('Chào buổi sáng, anh','Tất cả POS · 7 ngày · so với 7 ngày trước cùng mốc giờ')+need('3 việc cần anh xem','2 người TL chốt dưới 40% · POS Mẫu C hủy 6,1% · 4 CSKH gọi dưới mức','Xem từng việc')+kp([['DT chốt','1,84 tỷ','+8,2%','','Người hậu tố MKT, CSKH, SALE'],['Đơn chốt','2.316','+5,1%','','Đơn đã xác nhận trong kỳ'],['TL chốt Sale','46,3%','−1,2 điểm','a','Đơn New ÷ số về chia Sale'],['TL hủy','5,4%','+0,9 điểm','r','Đỏ khi từ 5%',1]])+`<div class="two mt"><div class="card"><div class="ct">DT chốt theo ngày<small>kỳ này đậm, ngày cũ xám</small></div>${bars([52,61,48,70,66,58,81])}</div><div class="card"><div class="ct">Theo bộ phận</div>${hb([['Sale','1,02 tỷ',100],['CSKH','0,61 tỷ',60],['MKT tự chốt','0,21 tỷ',21]])}</div></div>`,
'Marketing':()=>head('Marketing','DT chốt (New) của người có chi phí · 7 ngày')+need('2 marketer ROAS dưới 1','Chi phí kỳ này lớn hơn DT chốt (New) mang về','Xem 2 người')+kp([['Chi phí','412 tr','+3,0%','g','Từ sheet CPQC Daily'],['Số về chia Sale','5.004','+6,4%','','SĐT không trùng'],['Chi phí / số','82 k','−3,1%','','Chi phí ÷ số về'],['ROAS','2,48','+0,12','','DT chốt (New) ÷ chi phí']])+`<div class="two mt"><div class="card"><div class="ct">Số về theo ngày</div>${bars([44,58,62,51,73,69,77])}</div><div class="card"><div class="ct">TL chốt theo team Sale</div>${hb([['Team 1','51%',100],['Team 2','47%',92],['Team 3','38%',74,1]])}</div></div><div class="card mt"><div class="ct">Xếp hạng marketer<button class="btn" onclick="toast('Đã xuất Excel',1)">Xuất Excel</button></div>${tbl(['Marketer','Chi phí','Số về','Đơn New','TL chốt','DT New','ROAS'],[[who(ppl[0],'MKT'),'96 tr','1.210','588','48,6%','310 tr','3,23'],[who(ppl[1],'MKT'),'88 tr','1.034','452','43,7%','236 tr','2,68'],[who(ppl[2],'MKT'),'74 tr','902','341',['37,8%'],'171 tr','2,31'],[who(ppl[3],'MKT'),'61 tr','655','262','40,0%','58 tr',['0,95']]])}</div>`,
'Sale':()=>head('Sale','Người bấm xác nhận đơn · 7 ngày')+need('2 người TL chốt dưới 40%','Mốc đỏ áp dụng mọi nơi: TL chốt dưới 40%, hủy từ 5%, hoàn từ 7%','Xem 2 người')+kp([['DT chốt','1,02 tỷ','+6,0%','','Tính cả đơn hủy sau chốt'],['Số được chia','5.004','+6,4%','','SĐT không trùng'],['TL chốt','46,3%','−1,2 điểm','a','Đơn New ÷ số được chia'],['TL hoàn','7,6%','+0,8 điểm','r','Đỏ khi từ 7%',1]])+`<div class="card mt"><div class="ct">Theo nhân viên · 4 người<small>bấm một dòng xem cách tính</small></div>${tbl(['Nhân viên','Số chia','Đơn New','TL chốt','DT chốt','TL hủy','TL hoàn'],[[who(ppl[4],'SALE','T1'),'612','318','52,0%','176 tr','3,1%','4,8%'],[who(ppl[5],'SALE','T1'),'598','287','48,0%','161 tr','4,2%','6,1%'],[who(ppl[0],'SALE','T2'),'640','243',['38,0%'],'129 tr',['5,6%'],'6,4%'],[who(ppl[1],'SALE','T0'),'575','201',['35,0%'],'104 tr','4,0%',['7,9%']]])}</div>`,
'CSKH':()=>head('CSKH','Khách cũ mua lại · 7 ngày · không tính tỉ lệ chốt')+need('186 khách quá 20 ngày chưa có ghi chú','Chia theo người đang cầm khách, nhiều nhất 61 khách ở một người','Xem theo người')+kp([['DT CSKH','0,61 tỷ','+4,4%','','Đơn mua lại đã chốt'],['Số đơn CSKH','1.092','+3,8%','','Đơn mua lại trong kỳ'],['Khách đã gọi','5.192','+2,0%','','SĐT không trùng'],['Khách/người/ngày','18','−1','a','Mức đặt: 17']])+`<div class="two mt"><div class="card"><div class="ct">Khách đã gọi theo ngày</div>${bars([66,71,58,74,69,49,72])}</div><div class="card"><div class="ct">Khách/ngày theo người<small>đỏ là dưới mức 17</small></div>${hb([[ppl[2],'19',100],[ppl[3],'18',95],[ppl[4],'16',84,1],[ppl[5],'15',79,1]])}</div></div>`,
'Giao hàng':()=>head('Giao hàng','Đơn chuyển đi · 7 ngày')+`<div class="warn" style="margin-bottom:16px">Dữ liệu Pancake đang trễ 12 phút, số dưới đây tính đến 9h30.<button class="btn" onclick="toast('Đang gom lại')">Gom lại</button></div>`+kp([['Đơn chuyển đi','2.104','+5,5%','','Đơn rời kho trong kỳ'],['Doanh số chuyển đi','1,66 tỷ','+7,1%','','Giá trị đơn chuyển đi'],['Giao thành công','86,2%','+0,6 điểm','','Khách đã nhận'],['TL hoàn','7,6%','+0,8 điểm','r','Đỏ khi từ 7%',1]])+`<div class="two mt"><div class="card"><div class="ct">TL hoàn theo ngày<small>cột đỏ là từ 7%</small></div>${bars([40,52,71,48,75,58,73],70)}</div><div class="card"><div class="ct">Lý do hoàn</div>${hb([['Không nghe máy','38%',100],['Đổi ý','27%',71],['Sai hàng','12%',32],['Khác','23%',60]])}</div></div>`,
'Khách hàng':()=>head('Khách hàng','Hồ sơ khách · tất cả POS',1)+`<div class="card"><div class="ct">Khách lâu chưa mua · 4 khách<button class="btn" onclick="toast('Đã xuất Excel',1)">Xuất Excel</button></div>${tbl(['Khách','Lần mua cuối','Số đơn','Tổng mua','Người chăm','Ghi chú gần nhất'],[['Khách mẫu 01','32 ngày','4','2,1 tr',ppl[2]+' CSKH','3 ngày trước'],['Khách mẫu 02','41 ngày','2','0,9 tr',ppl[3]+' CSKH',['24 ngày trước']],['Khách mẫu 03','45 ngày','6','3,4 tr',ppl[4]+' CSKH','8 ngày trước'],['Khách mẫu 04','58 ngày','1','0,4 tr',ppl[5]+' CSKH',['31 ngày trước']]])}</div>`,
'Giao việc':()=>head('Giao việc','Việc của team · tuần này',1)+`<div class="grid3">${[['Chờ làm','g',['Gọi lại 61 khách quá 20 ngày','Rà 2 marketer ROAS dưới 1']],['Đang làm','a',['Kèm 2 Sale TL chốt dưới 40%']],['Xong','',['Chốt KPI tháng 11','Ghép tên sheet với POS']]].map(([t,c,a])=>`<div class="card"><div class="ct">${t}<span class="pill ${c}">${a.length}</span></div><div class="list" style="margin-top:8px">${a.map((x,i)=>`<div><span>${x}<small>${ppl[i]} · hạn 28/11</small></span></div>`).join('')}</div></div>`).join('')}</div>`,
'Nhân sự':()=>head('Nhân sự','Chia team và cấp bậc',1)+`<div class="card"><div class="ct">Nhân viên · 4 người<button class="btn g" onclick="toast('Mở khung thêm người')">Thêm người</button></div>${tbl(['Nhân viên','Bộ phận','Team','POS','Trạng thái'],[[who(ppl[0],'MKT'),'Marketing','MKT 1','POS Mẫu A','<span class="pill">Đang làm</span>'],[who(ppl[4],'SALE','T1'),'Sale','Team 1','POS Mẫu A','<span class="pill">Đang làm</span>'],[who(ppl[2],'CSKH','T9'),'CSKH','CSKH HN','POS Mẫu B','<span class="pill a">Thử việc</span>'],[who(ppl[3],'CSKH'),'CSKH','CSKH HN','POS Mẫu B','<span class="pill g">Đã nghỉ</span>']])}</div>`,
'Cài đặt':()=>head('Cài đặt','Mốc cảnh báo và thông báo',1)+`<div class="two"><div class="card"><div class="ct">Mốc đỏ</div><div class="frm" style="margin-top:12px">${[['TL chốt Sale dưới','40%'],['TL hủy từ','5%'],['TL hoàn từ','7%'],['CSKH khách/ngày dưới','17']].map(([l,v])=>`<div class="fld"><label>${l}</label><div>${v}</div></div>`).join('')}</div><div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="btn">Hủy</button><button class="btn p" onclick="toast('Đã lưu mốc đỏ',1)">Lưu</button></div></div><div class="card"><div class="ct">Thông báo</div><div class="list" style="margin-top:6px">${[['Bản tin sáng 7h30',1],['Báo khi TL hủy vượt mốc',1],['Báo khi dữ liệu trễ quá 30 phút',0]].map(([t,o])=>`<div><span>${t}</span><button class="sw ${o?'on':''}" aria-label="${t}" onclick="this.classList.toggle('on')"></button></div>`).join('')}</div></div></div>`,
'Bộ linh kiện':()=>`<div class="h1"><div>Bộ linh kiện dùng chung<small>Mọi trang chỉ ghép từ các khối dưới đây, không trang nào vẽ riêng</small></div></div>
<div class="grid3"><div class="card"><div class="lab">Màu</div><div class="swt"><i style="background:#17684b" title="Xanh chủ đạo"></i><i style="background:#17201b"></i><i style="background:#c6cdc8"></i><i style="background:#f1f3f1"></i><i style="background:#c93a34"></i><i style="background:#fdf1dc"></i></div><p style="font-size:12.5px;color:var(--fg2);margin:10px 0 0">Xanh #17684b là màu nhấn duy nhất. Đỏ chỉ cho số vượt mốc. Vàng chỉ cho dữ liệu trễ. Còn lại đen và xám.</p></div>
<div class="card"><div class="lab">Nút</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p">Nút chính</button><button class="btn g">Thêm mới</button><button class="btn">Nút phụ</button><button class="btn d">Xoá</button></div><div class="lab" style="margin-top:16px">Nhãn</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">+8,2%</span><span class="pill a">−1,2 điểm</span><span class="pill r">Vượt mốc</span><span class="pill g">Đã nghỉ</span></div></div>
<div class="card"><div class="lab">Bộ lọc</div><div class="seg"><button>Hôm nay</button><button class="on">7 ngày</button><button>Tháng</button></div><div class="pos" style="margin:10px 0 0"><button class="chip on">Tất cả POS</button><button class="chip">POS Mẫu A</button></div></div></div>
<div class="grid3 mt"><div class="card"><div class="lab">Đang tải</div><div class="sk" style="width:40%"></div><div class="sk" style="height:28px;width:60%;margin:10px 0"></div><div class="sk"></div><p style="font-size:12.5px;color:var(--fg2);margin:10px 0 0">Khung xám đúng hình ô số thật, tải xong không bị giật.</p></div>
<div class="card"><div class="lab">Không có dữ liệu</div><b>Không ai dưới mức trong kỳ này</b><p style="font-size:12.5px;color:var(--fg2);margin:4px 0 10px">Thấp nhất 17 khách/ngày, mức đặt 17.</p><button class="btn">Đổi kỳ</button></div>
<div class="card"><div class="lab">Lỗi</div><div class="warn">Chưa tải được số liệu.<button class="btn" onclick="toast('Đang tải lại')">Thử lại</button></div><div class="lab" style="margin-top:16px">Thông báo nhỏ</div><button class="btn" onclick="toast('Đã lưu',1)">Bấm xem thử</button></div></div>
<div class="card mt"><div class="lab">Khung chung của mọi trang, từ trên xuống</div><div class="list"><div><span>1. Tên trang, một dòng ghi số tính trong phạm vi nào, chọn kỳ<small>Bên dưới là hàng nút chọn POS một dòng</small></span></div><div><span>2. Dải "cần xem" màu hồng<small>Chỉ hiện khi có số vượt mốc, kèm một nút đi thẳng tới chỗ xử lý</small></span></div><div><span>3. Hàng bốn ô số<small>Số lớn, nhãn tăng giảm so với kỳ trước, một dòng ghi cách tính. Bấm ra chi tiết</small></span></div><div><span>4. Biểu đồ<small>Kỳ này đậm, kỳ cũ xám, đỏ khi vượt mốc</small></span></div><div><span>5. Bảng<small>Bấm một dòng mở khung bên phải ghi cách tính, giữ nguyên bộ lọc</small></span></div></div></div>`
};
const names=Object.keys(P);
function go(n){$('#body').innerHTML=P[n]();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.textContent==n));document.querySelectorAll('.seg').forEach(s=>s.onclick=e=>{if(e.target.tagName=='BUTTON'){s.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on')}});document.querySelectorAll('.pos').forEach(s=>s.onclick=e=>{if(e.target.classList.contains('chip')){s.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));e.target.classList.add('on')}});window.scrollTo({top:0})}
names.forEach(n=>{const b=document.createElement('button');b.className='tab'+(n=='Bộ linh kiện'?' kit':'');b.textContent=n;b.onclick=()=>go(n);$('#nav').appendChild(b)});
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML=m+(undo?' <u>Hoàn tác</u>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function why(t,v){$('#panel').innerHTML=`<button class="x" onclick="shut()" aria-label="Đóng">×</button><h3>${t}</h3><div style="color:var(--mute);font-size:12.5px">Tất cả POS · 7 ngày</div>${v?`<div style="font-size:34px;font-weight:700;margin-top:10px">${v}</div>`:''}<div class="calc"><b>Vì sao ra số này</b><div><span>Phạm vi</span><span>Người hậu tố MKT, CSKH, SALE</span></div><div><span>Kỳ trước cùng mốc giờ</span><span>số ảo</span></div><div><span>Nguồn</span><span>Pancake, gom lúc 9h30</span></div></div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn p" onclick="toast('Mở trang chi tiết, giữ bộ lọc');shut()">Mở trang chi tiết</button><button class="btn" onclick="toast('Đã xuất Excel',1)">Xuất Excel</button></div>`;$('#panel').classList.add('on');$('#scrim').classList.add('on')}
function shut(){$('#panel').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=shut;document.addEventListener('keydown',e=>{if(e.key=='Escape')shut()});
go('Marketing');
</script>
