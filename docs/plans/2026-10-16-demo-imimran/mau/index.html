<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo 2 · Megatech</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font-ui)}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,summary{touch-action:manipulation}button,.control{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button:hover,a:hover{border-color:var(--ring)}.brand{font-size:19px;font-weight:700;letter-spacing:-.7px}.brand em{font-style:normal;color:var(--primary)}.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;background:var(--tint);color:var(--primary);border-radius:6px;letter-spacing:0}.sidebar{position:fixed;inset:0 auto 0 0;width:208px;padding:28px 16px;background:var(--sb);border-right:1px solid var(--sb-line);color:var(--sb-ink);display:flex;flex-direction:column;gap:32px}.sidebar nav{display:grid;gap:8px}.nav-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;color:var(--sb-ink-2)}.nav-item[aria-current]{background:var(--sb-accent);color:var(--sb-ink);font-weight:600}.nav-icon{width:20px;text-align:center;font-size:19px}.eyebrow{color:var(--ink-3);font-size:12px;margin:0 0 12px}.sidebar .eyebrow{color:var(--sb-ink-3);padding-left:12px}.account{margin-top:auto;border-top:1px solid var(--sb-line);padding-top:20px;font-size:12px;color:var(--sb-ink-2)}.avatar{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--primary);font-size:11px;margin-right:9px}.workspace{margin-left:208px;min-width:0}.topbar{min-height:68px;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border-bottom:1px solid var(--line)}.topbar small{color:var(--ink-3)}.top-actions{display:flex;gap:10px;align-items:center}main{padding:28px 32px;max-width:1440px;margin:auto;min-width:0}h1{font-size:26px;line-height:1.4;font-weight:600;margin:0 0 6px;letter-spacing:-.7px}h2{font-size:16px;line-height:1.5;font-weight:600;margin:0}p{margin:0}.muted{color:var(--ink-3)}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters span{font-size:12px}.notice{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:12px;margin-bottom:16px}.dot{color:var(--good)}.card{background:var(--surface);border:1px solid var(--card-line);border-radius:14px;box-shadow:var(--shadow);min-width:0}.kpi-tray{padding:18px;background:var(--surface-3);border-radius:18px;margin-bottom:20px}.tray-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12px;color:var(--ink-2)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--card-line);border-radius:12px;overflow:hidden}.kpi{background:var(--surface);min-width:0}.kpi-body{padding:20px 18px}.kpi p{font-size:12px;color:var(--ink-2);min-height:38px}.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}.kpi strong{font-size:28px;line-height:1.4;display:block;overflow-wrap:anywhere}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;background:var(--surface-2);padding:9px 18px;font-size:11px;color:var(--ink-3)}.positive{color:var(--good)}.negative{color:var(--bad)}.trend{display:grid;grid-template-columns:250px minmax(0,1fr);padding:24px;gap:32px;margin-bottom:20px;align-items:center}.trend .big{font-size:36px;display:block;margin:16px 0 4px}.trend-copy{padding-right:24px;border-right:1px solid var(--line)}.chart svg{width:100%;height:190px;display:block;overflow:visible}.chart-labels,.legend{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11px}.legend{justify-content:center;gap:20px;margin-top:12px;flex-wrap:wrap}.legend i{display:inline-block;width:16px;border-top:2px solid var(--primary);margin:0 6px 3px 0}.legend .previous{border-top:2px dashed var(--ink-3)}.table-card{padding:22px 0 8px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px 16px}.section-head small{color:var(--ink-3)}.table-wrap{overflow:auto;max-width:100%}table{width:100%;min-width:560px;border-collapse:collapse;text-align:left}th,td{padding:14px 22px;border-top:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--ink-3);font-weight:500;background:var(--surface-2)}td{font-size:13px}td:not(:first-child),th:not(:first-child){text-align:right}.row-sub{display:block;color:var(--ink-3);font-size:11px;padding-left:41px}.status{background:var(--good-bg);color:var(--good);padding:4px 8px;border-radius:6px;font-size:11px}.mobile-menu{display:none}.endnote{font-size:11px;color:var(--ink-3);margin-top:18px}.login{max-width:none;padding:0;display:grid;grid-template-columns:48% 52%;min-height:calc(100vh - 68px)}.form-side{display:flex;align-items:center;justify-content:center;padding:48px 28px;background:var(--surface)}.form-box{width:100%;max-width:360px}.form-box h1{font-size:30px;margin-top:36px}.form-box label{display:block;margin:22px 0 8px;font-size:12px;font-weight:500}.form-box input{width:100%;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;min-height:48px}.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}.form-box button{width:100%;margin-top:20px}.form-note{font-size:12px;color:var(--ink-3);margin-top:14px}.art-side{position:relative;display:flex;flex-direction:column;justify-content:center;padding:64px;background:var(--tint);overflow:hidden}.art-side h2{font-size:32px;line-height:1.4;max-width:340px;letter-spacing:-1px;position:relative}.art-side p{max-width:330px;color:var(--ink-2);margin-top:20px}.sculpture{height:270px;position:relative;margin-bottom:50px}.sculpture:before,.sculpture:after{content:'';position:absolute;left:18%;top:15px;width:180px;height:240px;border:30px solid var(--primary);border-radius:110px;transform:rotate(35deg)}.sculpture:after{left:42%;top:55px;border-color:var(--primary-2);transform:rotate(-35deg);opacity:.6}.login-top{margin-left:0}.login-links{display:flex;gap:18px;flex-wrap:wrap;font-size:12px}.login-top .brand{font-size:17px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(max-width:1000px){.page-head{align-items:flex-start;flex-direction:column}.kpi strong{font-size:24px}.trend{grid-template-columns:210px minmax(0,1fr)}.art-side{padding:32px}}
    @media(max-width:700px){.sidebar{display:none}.workspace{margin:0}.topbar{padding:12px 16px;position:sticky;top:0;z-index:5}.topbar small,.desktop-label{display:none}.top-actions{gap:6px}.top-actions button{padding:8px 10px}.mobile-menu{display:block;position:relative}.mobile-menu summary{padding:8px;min-height:44px;display:flex;align-items:center;cursor:pointer}.mobile-menu nav{position:absolute;top:48px;left:0;width:220px;background:var(--sb);border:1px solid var(--sb-line);box-shadow:var(--shadow-pop);padding:8px;border-radius:10px;color:var(--sb-ink)}main{padding:22px 16px}h1{font-size:22px}.page-head{gap:16px}.filters{width:100%}.filters span:first-child{flex-basis:100%}.kpi-tray{padding:10px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-body{padding:14px 12px}.kpi strong{font-size:24px}.foot{padding:8px 12px;font-size:10px}.trend{grid-template-columns:1fr;padding:20px;gap:20px}.trend-copy{padding:0 0 16px;border-right:0;border-bottom:1px solid var(--line)}.trend .big{font-size:30px;margin-top:12px}.chart svg{height:160px}.section-head{padding:0 16px 16px;align-items:flex-start;flex-direction:column}.login{grid-template-columns:1fr}.form-side{padding:32px 24px 40px}.form-box h1{font-size:26px;margin-top:24px}.art-side{padding:32px 24px}.art-side h2{font-size:26px}.sculpture{height:200px;margin-bottom:24px}.sculpture:before,.sculpture:after{width:130px;height:175px;border-width:22px}.login-top{flex-wrap:wrap}.login-links{gap:12px}.login-top .top-actions{margin-left:auto}}
    @media(prefers-reduced-motion:no-preference){a,button{transition:background 140ms,border-color 140ms}}
  </style>
</head>
<body>
<noscript>Mẫu cần JavaScript cục bộ để chọn màn và chủ đề. Không có kết nối mạng.</noscript>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  const screen = ['home','sale','vandon','login'].includes(params.get('s')) ? params.get('s') : 'home';
  const theme = params.get('t') === 'dark' ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', theme === 'dark');
  const names = {home:'Tổng quan POS',sale:'Tổng quan Sale',vandon:'Vận đơn',login:'Đăng nhập'};
  document.title = names[screen] + ' · Demo 2';
  const url = (s,t=theme) => '?s='+s+'&t='+t;
  const nav = () => [['home','▦','Tổng quan POS'],['sale','♧','Sale'],['vandon','⇄','Vận đơn'],['login','↪','Đăng nhập']].map(([s,icon,label])=>`<a class="nav-item" href="${url(s)}" ${screen===s?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</a>`).join('');
  const brand = '<span class="brand">mega<em>tech</em><span class="sr-only"> · Tổng hợp POS</span></span>';
  const themeLink = `<a class="control" href="${url(screen,theme==='dark'?'light':'dark')}" aria-label="Chuyển sang chế độ ${theme==='dark'?'sáng':'tối'}">${theme==='dark'?'☀ Sáng':'☾ Tối'}</a>`;
  const chart = `<div class="chart"><svg role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 640 190" preserveAspectRatio="none"><title id="chart-title">Xu hướng minh họa</title><desc id="chart-desc">Sáu mốc dữ liệu hư cấu. Đường liền là kỳ này, nét đứt là kỳ trước; không dùng để tính số nghiệp vụ.</desc><g stroke="var(--chart-grid)"><path d="M0 25H640M0 75H640M0 125H640M0 175H640"/></g><path d="M0 155C50 150 70 105 128 120S210 155 256 110S340 125 384 95S470 110 512 75S590 95 640 50" fill="none" stroke="var(--ink-3)" stroke-dasharray="5 5" stroke-width="2"/><path d="M0 145C50 145 80 65 128 85S200 130 256 75S330 95 384 48S460 85 512 40S590 50 640 18" fill="none" stroke="var(--primary)" stroke-width="2.5"/></svg><div class="chart-labels"><span>11/10</span><span>12/10</span><span>13/10</span><span>14/10</span><span>15/10</span><span>16/10</span></div><div class="legend"><span><i></i>Kỳ này</span><span><i class="previous"></i>Kỳ trước cùng mốc giờ</span></div></div>`;
  const shipping = screen==='vandon';
  const sale = screen==='sale';
  const metrics = shipping ? [['Đơn chuyển đi','1.280','+8,2%'],['Doanh số chuyển đi','486,4 tr ₫','+6,8%'],['Giao thành công','920','+5,4%'],['Hoàn','48','−2,0%']] : [['Doanh thu đơn chốt',sale?'268,8 tr ₫':'428,6 tr ₫','+12,4%'],['Đơn chốt',sale?'672':'1.080','+8,2%'],['Đơn tạo mới',sale?'940':'1.640','+6,8%'],['Tiền hàng giao thành công',sale?'212,4 tr ₫':'356,2 tr ₫','+5,4%']];
  const kpis = `<section class="kpi-tray" aria-label="Chỉ số minh họa"><div class="tray-title"><span>Toàn cảnh kỳ này</span><span>Số minh họa</span></div><div class="kpis">${metrics.map(([label,value,change])=>`<article class="kpi"><div class="kpi-body"><p>${label}</p><strong class="num">${value}</strong></div><div class="foot"><span>So kỳ trước</span><b class="${change.startsWith('−')?'negative':'positive'}">${change}</b></div></article>`).join('')}</div></section>`;
  const tableTitle = shipping?'Người lên đơn':sale?'Nhân viên Sale':'Theo POS';
  const rows = (shipping ? [['NV ảo 01 · SALE','496','188,4 tr ₫'],['NV ảo 02 · CSKH','432','164,2 tr ₫'],['NV ảo 03 · MKT','352','133,8 tr ₫']] : sale ? [['NV ảo 01','256','102,4 tr ₫'],['NV ảo 02','224','89,6 tr ₫'],['NV ảo 03','192','76,8 tr ₫']] : [['POS mẫu A','420','168,0 tr ₫'],['POS mẫu B','360','142,6 tr ₫'],['POS mẫu C','300','118,0 tr ₫']]);
  const table = `<section class="card table-card"><div class="section-head"><h2>${tableTitle}</h2><small>3 dòng minh họa · không phải dữ liệu thật</small></div><div class="table-wrap" tabindex="0" role="region" aria-label="Bảng ${tableTitle}, cuộn ngang trên điện thoại"><table><thead><tr><th>${tableTitle}</th><th>${shipping?'Đơn chuyển đi':'Đơn chốt'}</th><th>${shipping?'Doanh số chuyển đi':'Doanh thu đơn chốt'}</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(([name,count,value],i)=>`<tr><td><span class="avatar" aria-hidden="true">0${i+1}</span>${name}<span class="row-sub">Dữ liệu hư cấu</span></td><td class="num">${count}</td><td class="num">${value}</td><td><span class="status">Đã đồng bộ</span></td></tr>`).join('')}</tbody></table></div></section>`;
  const dashboard = `<aside class="sidebar">${brand}<div><p class="eyebrow">TỔNG HỢP POS</p><nav aria-label="Màn mẫu">${nav()}</nav></div><div class="account"><span class="avatar">M</span>Tài khoản minh họa<br><p style="margin-top:12px">Mẫu thiết kế · ngoại tuyến</p></div></aside><div class="workspace"><header class="topbar"><details class="mobile-menu"><summary aria-label="Mở menu">☰ Menu</summary><nav aria-label="Màn mẫu điện thoại">${nav()}</nav></details><span class="desktop-label">Không gian làm việc <small> / ${names[screen]}</small></span><div class="top-actions"><span class="badge">Demo 2</span>${themeLink}</div></header><main><div class="page-head"><div><h1>${names[screen]}</h1><p class="muted">${shipping?'Theo dõi đơn chuyển đi và người lên đơn.':sale?'Số liệu và xu hướng của bộ phận Sale.':'Nhìn rõ số liệu, theo dõi từng chuyển động.'}</p></div><div class="filters" aria-label="Phạm vi minh họa"><span class="control">11–16/10/2026</span><span class="control">Tất cả POS</span><span class="control">Tất cả team</span></div></div><div class="notice"><span><span class="dot">●</span> Đồng bộ minh họa · 16/10, 14:30</span><span>Dữ liệu hư cấu · không kết nối API</span></div>${kpis}<section class="card trend"><div class="trend-copy"><p class="eyebrow">XU HƯỚNG TRONG KỲ</p><h2>${shipping?'Doanh số chuyển đi':'Doanh thu đơn chốt'}</h2><strong class="big num">${metrics[shipping?1:0][1]}</strong><p class="positive">↗ ${metrics[shipping?1:0][2]} <span class="muted">so kỳ trước</span></p><p class="muted" style="font-size:12px;margin-top:16px">Đối chiếu cùng mốc giờ<br>Biểu đồ và số đều là minh họa.</p></div>${chart}</section>${table}<p class="endnote">Mẫu R2 · Các bộ lọc là nhãn trình bày tĩnh. Bản ứng dụng giữ nguyên cách tính, quyền xem và thao tác bấm số mở chi tiết.</p></main></div>`;
  const login = `<header class="topbar login-top">${brand}<nav class="login-links" aria-label="Màn mẫu"><a href="${url('home')}">Tổng quan</a><a href="${url('sale')}">Sale</a><a href="${url('vandon')}">Vận đơn</a></nav><div class="top-actions"><span class="badge">Demo 2</span>${themeLink}</div></header><main class="login"><section class="form-side"><div class="form-box"><span class="badge">TỔNG HỢP POS</span><h1>Chào mừng trở lại</h1><p class="muted">Đăng nhập vào không gian làm việc.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="off" placeholder="Nhập email minh họa" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="off" placeholder="Nhập mật khẩu minh họa" required><button class="primary" type="submit">Đăng nhập</button></form><button id="demo-button" type="button">Xem tài khoản demo</button><p class="form-note" id="login-status" role="status">Mẫu tĩnh · không gửi hoặc lưu thông tin đăng nhập.</p></div></section><section class="art-side" aria-label="Giới thiệu"><div class="sculpture" aria-hidden="true"></div><p class="eyebrow">MEGATECH / KHÔNG GIAN DỮ LIỆU</p><h2>Một góc nhìn chung.<br>Rõ từng con số.</h2><p>Bố cục minh họa cho Demo 2, lấy cảm hứng từ cách chia đôi màn hình Qanun.</p></section></main>`;
  document.getElementById('root').innerHTML = screen==='login'?login:dashboard;
  document.getElementById('login-form')?.addEventListener('submit',event=>{event.preventDefault();document.getElementById('login-status').textContent='Đây là mẫu tĩnh. Thông tin không được gửi hoặc lưu.';});
  document.getElementById('demo-button')?.addEventListener('click',()=>{document.getElementById('login-status').textContent='Tài khoản demo sẽ có trong ứng dụng; mẫu R2 chỉ trình bày bố cục.';});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){const menu=document.querySelector('details[open]');if(menu){menu.open=false;menu.querySelector('summary').focus();}}});
</script>
</body>
</html>
