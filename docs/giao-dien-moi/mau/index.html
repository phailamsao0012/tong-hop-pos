<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megatech Ops · mẫu giao diện</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* Mẫu tĩnh cho plan giao diện mới (12/10/2026). Số liệu là số ẢO. ?s=home|cskh|orders|palette  &t=dark */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13.5px/1.45 var(--o-font);color:var(--o-ink);background:var(--o-app);-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--o-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Khung */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sb{padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.ws .logo{width:30px;height:30px;border-radius:8px;background:var(--o-accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.ws b{display:block;font-size:13.5px;line-height:1.1}
.ws span{font-size:11.5px;color:var(--o-ink-3)}
.ws .chev{margin-left:auto;color:var(--o-ink-3)}
.grp{margin:12px 8px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--o-ink-3)}
.it{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;color:var(--o-ink-2);font-weight:500;cursor:default}
.it:hover{background:rgba(20,32,25,.04)}
.it.on{background:var(--o-select);color:var(--o-ink);box-shadow:var(--o-shadow-sel)}
.it.on svg{color:var(--o-accent)}
.it .ct{margin-left:auto;font:500 11.5px var(--o-mono);color:var(--o-ink-3)}
.it .bd{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--o-now);color:#fff;font:600 10.5px/18px var(--o-mono);text-align:center}
.it .sub{margin-left:auto;color:var(--o-ink-4)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--o-line)}
.av{width:30px;height:30px;border-radius:999px;background:#d9ead f;display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--o-accent);background:var(--o-accent-soft);flex:none}
.me b{display:block;font-size:13px;line-height:1.15}.me span{font-size:11.5px;color:var(--o-ink-3)}
.me .chev{margin-left:auto;color:var(--o-ink-3)}

.main{background:var(--o-main);border-left:1px solid var(--o-line);min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--o-line);position:sticky;top:0;background:color-mix(in srgb,var(--o-main) 88%,transparent);backdrop-filter:blur(8px);z-index:5}
.crumb{display:flex;align-items:center;gap:6px;color:var(--o-ink-3);font-weight:500}
.crumb b{color:var(--o-ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:340px;height:34px;padding:0 10px;border:1px solid var(--o-line-2);border-radius:var(--o-r-ctl);background:var(--o-card);color:var(--o-ink-3)}
.kbd{margin-left:auto;font:500 11px var(--o-mono);padding:1px 6px;border:1px solid var(--o-line-2);border-radius:5px;color:var(--o-ink-3);background:var(--o-main)}
.sync{display:flex;align-items:center;gap:6px;font:500 12px var(--o-mono);color:var(--o-ink-2);padding:0 4px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--o-good);flex:none}
.ib{width:34px;height:34px;border-radius:var(--o-r-ctl);display:grid;place-items:center;color:var(--o-ink-2);position:relative;border:0;background:none}
.ib .pip{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:99px;background:#e8813a;border:1.5px solid var(--o-main)}
.page{padding:28px 32px 40px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}

/* Tiêu đề */
.hello{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hello span{color:var(--o-ink-3)}
.subline{margin-top:6px;font:400 12.5px var(--o-font);color:var(--o-ink-3)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0}
.ph p{margin:4px 0 0;color:var(--o-ink-3)}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.btn{height:34px;padding:0 14px;border-radius:var(--o-r-ctl);border:1px solid var(--o-line-2);background:var(--o-card);font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--o-ink)}
.btn.pri{background:var(--o-accent);border-color:var(--o-accent);color:var(--o-accent-ink);box-shadow:var(--o-shadow-btn)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--o-ink-2)}

/* Thanh lọc */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--o-tray);border:1px solid var(--o-line);gap:2px}
.seg b{height:28px;padding:0 11px;border-radius:7px;display:flex;align-items:center;font-weight:500;color:var(--o-ink-2);font-size:12.5px}
.seg b.on{background:var(--o-card);color:var(--o-ink);font-weight:600;box-shadow:var(--o-shadow-sel)}
.sel{height:34px;padding:0 10px;border-radius:var(--o-r-ctl);border:1px solid var(--o-line-2);background:var(--o-card);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--o-ink-2)}
.sel b{color:var(--o-ink);font-weight:600}
.posdots{display:inline-flex}
.posdots i{width:9px;height:9px;border-radius:99px;margin-left:-3px;border:1.5px solid var(--o-card)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--o-card);border:1px solid var(--o-line);border-radius:var(--o-r-card);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .h{display:flex;align-items:center;gap:8px;color:var(--o-ink-3);font-size:12px;font-weight:500}
.kpi .ic{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.kpi .v{font:600 26px/1.15 var(--o-mono);letter-spacing:-.03em}
.kpi .v small{font:500 14px var(--o-font);color:var(--o-ink-3);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--o-ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:var(--o-good);font:600 11.5px var(--o-mono)}.dn{color:var(--o-bad);font:600 11.5px var(--o-mono)}
.up .w,.dn .w{font:600 11.5px var(--o-font)}
.big small{font:500 13px var(--o-font);color:var(--o-ink-3);margin-left:3px}
.mkt-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--o-card);border:1px dashed var(--o-line-2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--o-ink-3)}
.mkt-line b{font:600 15px var(--o-mono);color:var(--o-ink)}
.mkt-line b small{font:500 12px var(--o-font);color:var(--o-ink-3);margin-left:2px}
.kpi .scope{font-size:11px;color:var(--o-ink-3);margin-top:-2px}
.t-green{background:#e2f2ea;color:#17684b}.t-blue{background:#e7effc;color:#2a5fc4}.t-orange{background:#fcefe4;color:#bb5a16}.t-purple{background:#eeeafb;color:#5b48b8}.t-red{background:#fcebea;color:#b83227}
.dark .t-green{background:#173426;color:#6fd59a}.dark .t-blue{background:#182842;color:#8fb4f2}.dark .t-orange{background:#3a2616;color:#f2a07a}.dark .t-purple{background:#272244;color:#b3a6ee}.dark .t-red{background:#3b1c1a;color:#f39389}

/* Thẻ + khay */
.card{background:var(--o-card);border:1px solid var(--o-line);border-radius:var(--o-r-card);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card>.hd h3{margin:0;font-size:14px;font-weight:600}
.card>.hd .note{color:var(--o-ink-3);font-size:12px}
.card>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card>.bd{padding:12px 16px 16px}
.tray{background:var(--o-tray);border:1px solid var(--o-line);border-radius:var(--o-r-tray);padding:6px;min-width:0}
.tray>.hd{display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
.tray>.hd h3{margin:0;font-size:14px;font-weight:600}
.tray>.hd .note{color:var(--o-ink-3);font-size:12px}
.tray>.hd .r{margin-left:auto}
.tray .inner{display:grid;gap:6px}
.tray{display:flex;flex-direction:column;gap:6px}
.tray .sub{background:var(--o-card);border:1px solid var(--o-line);border-radius:10px;padding:12px 14px;min-width:0}
.lbl{font-size:12px;color:var(--o-ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.big{font:600 22px/1.2 var(--o-mono);letter-spacing:-.03em;margin-top:4px}
.mini{font-size:11.5px;color:var(--o-ink-3);margin-top:2px}

/* Cột việc cần anh (Briefing) */
.home{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;min-height:calc(100vh - 56px)}
.brief{border-right:1px solid var(--o-line);padding:20px 14px;display:flex;flex-direction:column;gap:10px;background:var(--o-main)}
.brief>*{flex:none}
.brief .seg{align-self:flex-start}
.bg{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--o-ink-3);display:flex;align-items:center;gap:6px;margin:10px 6px 2px}
.bg .n{font:500 11px var(--o-mono);color:var(--o-ink-4);margin-left:auto}
.bi{display:flex;gap:10px;padding:9px 8px;border-radius:var(--o-r-row);align-items:flex-start}
.bi:hover{background:var(--o-hover)}
.bi.pick{background:var(--o-card);box-shadow:var(--o-shadow-pop)}
.bi .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.bi b{display:block;font-weight:600;font-size:13px;line-height:1.3}
.bi span{display:block;font-size:11.5px;color:var(--o-ink-3);margin-top:2px}
.bi .vv{margin-left:auto;font:500 12px var(--o-mono);color:var(--o-ink-2);white-space:nowrap;padding-left:6px}
.done-line{margin:auto 6px 0;padding-top:12px;border-top:1px dashed var(--o-line);font-size:11.5px;color:var(--o-ink-3)}

/* Biểu đồ */
.chart svg{display:block;width:100%;height:auto}
.chart text{font:500 10.5px var(--o-mono);fill:var(--o-ink-3)}
.chart .lab{font:600 11px var(--o-mono);fill:var(--o-ink)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--o-ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Bảng */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--o-ink-3);text-align:right;padding:9px 12px;border-bottom:1px solid var(--o-line);background:var(--o-tray);white-space:nowrap}
.tbl th:first-child{text-align:left;border-top-left-radius:8px}.tbl th:last-child{border-top-right-radius:8px}
.tbl th.on{color:var(--o-ink)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--o-line);text-align:right;white-space:nowrap;font:500 13px var(--o-mono);letter-spacing:-.02em}
.tbl td:first-child{text-align:left;font:500 13px var(--o-font);letter-spacing:0}
.tbl td small{display:block;font:400 11px var(--o-font);color:var(--o-ink-3);letter-spacing:0}
.tbl tr:hover td{background:var(--o-hover)}
.tbl tfoot td{font-weight:600;border-bottom:0;background:var(--o-tray)}
.who{display:flex;align-items:center;gap:10px}
.ini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 11px var(--o-font);flex:none}
.cmp{display:inline-flex;flex-direction:column;gap:3px;width:120px;vertical-align:middle}
.cmp i{display:block;height:5px;border-radius:9px;background:var(--o-tray)}
.cmp i b{display:block;height:100%;border-radius:9px}
.cmp em{display:flex;justify-content:space-between;font:400 10.5px var(--o-mono);font-style:normal;color:var(--o-ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:600 11.5px var(--o-font);white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor}
.p-new{background:var(--o-st-new-bg);color:var(--o-st-new)}.p-confirmed{background:var(--o-st-confirmed-bg);color:var(--o-st-confirmed)}
.p-shipping{background:var(--o-st-shipping-bg);color:var(--o-st-shipping)}.p-delivered{background:var(--o-st-delivered-bg);color:var(--o-st-delivered)}
.p-returned{background:var(--o-st-returned-bg);color:var(--o-st-returned)}.p-cancelled{background:var(--o-st-cancelled-bg);color:var(--o-st-cancelled)}

/* Trang danh sách đơn (dòng là thẻ) */
.kpis.r .kpi{flex-direction:row;align-items:center;gap:12px;background:var(--o-tray)}
.kpis.r .kpi .ic{margin:0;width:36px;height:36px;border-radius:9px;background:var(--o-card);border:1px solid var(--o-line)}
.kpis.r .kpi .t b{display:block;font-size:13px;font-weight:600}.kpis.r .kpi .t span{font-size:11.5px;color:var(--o-ink-3)}
.kpis.r .kpi .v{margin-left:auto;font-size:28px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--o-line);align-items:flex-end}
.tabs b{padding:10px 0;font-weight:500;color:var(--o-ink-3);display:flex;gap:7px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs b.on{color:var(--o-ink);font-weight:600;border-color:var(--o-accent)}
.tabs b em{font:500 11px var(--o-mono);font-style:normal;padding:1px 6px;border-radius:5px;background:var(--o-tray);color:var(--o-ink-3)}
.tabs b.on em{background:var(--o-accent-soft);color:var(--o-accent)}
.tabs .r{margin-left:auto;padding-bottom:6px}
.rows{background:var(--o-tray);border:1px solid var(--o-line);border-radius:var(--o-r-tray);padding:4px;display:flex;flex-direction:column;gap:4px}
.rh,.rw{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 150px 120px 130px 20px;gap:12px;align-items:center;padding:10px 14px}
.rh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--o-ink-3);padding:8px 14px 4px}
.rw{background:var(--o-card);border:1px solid var(--o-line);border-radius:var(--o-r-row)}
.rw:hover{border-color:var(--o-line-2)}
.rw .code{font:600 12.5px var(--o-mono)}.rw .code em{font-style:normal;color:var(--o-warn);margin-left:4px}
.rw .ds{font-size:12px;color:var(--o-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .money{font:600 13px var(--o-mono);text-align:right}
.rw .tm{font:500 12px var(--o-mono)}.rw .tm span{display:block;font:400 11px var(--o-font);color:var(--o-ink-3)}
.rw .gt{color:var(--o-ink-4)}
.foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--o-ink-3);padding:6px 4px}
.foot .r{margin-left:auto;display:flex;gap:6px;align-items:center}

/* Cần chú ý + tải theo người */
.att{display:flex;flex-direction:column}
.att .row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--o-line)}
.att .row:first-child{border-top:0}
.att .row b{display:block;font-weight:600;font-size:13px}
.att .row span{display:block;font-size:11.5px;color:var(--o-ink-3);margin-top:1px}
.att .row .acts{margin-left:auto;display:flex;gap:4px}
.circ{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;flex:none}
.load{display:flex;flex-direction:column;gap:11px}
.load .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12.5px}
.load .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .ln em{font:500 11.5px var(--o-mono);font-style:normal;color:var(--o-ink-2)}
.load .bar{grid-column:1/-1;height:6px;border-radius:9px;background:color-mix(in srgb,var(--o-accent) 18%,var(--o-tray));overflow:hidden}
.load .bar b{display:block;height:100%;background:var(--o-accent);border-radius:9px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* Ctrl K */
.veil{position:fixed;inset:0;background:rgba(10,16,12,.38);backdrop-filter:blur(2px);display:grid;place-items:start center;padding-top:110px;z-index:20}
.pal{width:640px;max-width:calc(100vw - 32px);background:var(--o-card);border-radius:14px;box-shadow:var(--o-shadow-pop);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--o-line);font-size:15px}
.pal .in span{color:var(--o-ink)}.pal .in .caret{width:1.5px;height:18px;background:var(--o-accent);margin-left:-8px}
.pal .chips{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--o-line)}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--o-line-2);display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--o-ink-2)}
.chip.on{background:var(--o-ink);border-color:var(--o-ink);color:var(--o-card)}
.pal .gl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--o-ink-3);padding:12px 16px 4px}
.pal .pi{display:flex;align-items:center;gap:10px;margin:0 6px;padding:8px 10px;border-radius:8px}
.pal .pi.on{background:var(--o-hover)}
.pal .pi b{font-weight:500}.pal .pi span{color:var(--o-ink-3);font-size:12px}
.pal .pi .rt{margin-left:auto;font:500 11.5px var(--o-mono);color:var(--o-ink-3)}
.pal .ft{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--o-line);font-size:11.5px;color:var(--o-ink-3);margin-top:8px}

/* Điện thoại */
.tabbar{display:none}
@media (max-width:767px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main,.page{min-width:0;max-width:100vw}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tabs{overflow-x:auto;scrollbar-width:none;gap:16px}
  .tabs b{flex:none;white-space:nowrap}
  .tabs .r{display:none}
  .subline{line-height:1.7}
  .ph .acts{margin-left:0}
  .card>.bd,.poscard{overflow-x:auto}
  .rh{display:none}
  .rw{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .rw>:nth-child(2){grid-column:1}
  .rw .gt{display:none}
  .kpis.r .kpi .v{font-size:22px}
  .kpis.r .kpi .ic{display:none}
  .card>.hd{flex-wrap:wrap}
  .card>.hd .note{display:none}
  .card>.hd .r{margin-left:0;width:100%;justify-content:space-between}
  .att .row .acts .ghost{display:none}
  .foot{flex-wrap:wrap}
  .foot .r>span{white-space:nowrap}
  .sb{display:none}
  .main{border-left:0}
  .top{padding:0 12px;gap:8px}
  .search{display:none}
  .crumb .hide{display:none}
  .page{padding:18px 16px 96px;gap:16px}
  .home{grid-template-columns:minmax(0,1fr)}
  .brief{display:none}
  .mbrief{display:block!important}
  .hello{font-size:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:21px}
  .grid3{grid-template-columns:1fr}
  .fbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .fbar .seg b{flex:none;white-space:nowrap}

function bars(vals, prev, labels, w = 760, h = 210) {
  const max = 280, pad = { l: 34, r: 8, t: 22, b: 22 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b, n = vals.length, step = iw / n, bw = Math.min(26, step * .48);
  const y = (v) => pad.t + ih - v / max * ih;
  let g = '';
  for (const t of [0, 70, 140, 210, 280]) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--o-grid)"/><text x="${pad.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`;
  vals.forEach((v, i) => {
    const x = pad.l + step * i + (step - bw) / 2, last = i === n - 1;
    const pv = prev[i];
    g += `<rect x="${x + bw + 3}" y="${y(pv)}" width="4" height="${pad.t + ih - y(pv)}" rx="2" fill="var(--o-bar-2)"/>`;
    g += `<path d="M${x} ${pad.t + ih} V${y(v) + 4} q0 -4 4 -4 h${bw - 8} q4 0 4 4 V${pad.t + ih} Z" fill="${last ? 'var(--o-accent)' : 'var(--o-bar)'}"/>`;
    if (last) g += `<text class="lab" x="${x + bw / 2}" y="${y(v) - 7}" text-anchor="middle">${v} tr</text>`;
    g += `<text x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Doanh thu theo ngày">${g}</svg>`;
}
